<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="300" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">A Filter You Design vs A Filter The Computer Learns</text>

  <defs>
    <marker id="lfArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Row 1: hand designed -->
  <text x="20" y="65" font-size="12" font-weight="bold" fill="#1d4ed8">Part 1&#39;s way: YOU pick the numbers</text>

  <rect x="20" y="75" width="130" height="95" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="85" y="128" text-anchor="middle" font-size="26">🧑‍🔬</text>
  <text x="85" y="155" text-anchor="middle" font-size="9" fill="#666">a person decides</text>

  <line x1="150" y1="122" x2="180" y2="122" stroke="#aaa" stroke-width="1.5" marker-end="url(#lfArrow)"/>

  <rect x="183" y="75" width="140" height="95" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="198" y="95" width="30" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="213" y="115" fill="#1d4ed8">-1</text>
    <rect x="228" y="95" width="30" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="243" y="115" fill="#1d4ed8">0</text>
    <rect x="258" y="95" width="30" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="273" y="115" fill="#1d4ed8">1</text>
    <rect x="198" y="125" width="30" height="30" fill="#bfdbfe" stroke="#3b82f6"/><text x="213" y="145" fill="#1d4ed8">-2</text>
    <rect x="228" y="125" width="30" height="30" fill="#bfdbfe" stroke="#3b82f6"/><text x="243" y="145" fill="#1d4ed8">0</text>
    <rect x="258" y="125" width="30" height="30" fill="#bfdbfe" stroke="#3b82f6"/><text x="273" y="145" fill="#1d4ed8">2</text>
  </g>
  <text x="253" y="163" text-anchor="middle" font-size="9" fill="#1d4ed8">"Sobel edge filter"</text>

  <line x1="323" y1="122" x2="353" y2="122" stroke="#aaa" stroke-width="1.5" marker-end="url(#lfArrow)"/>

  <rect x="356" y="75" width="150" height="95" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="431" y="128" text-anchor="middle" font-size="12" fill="#374151">Always finds only</text>
  <text x="431" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">edges</text>
  <text x="431" y="160" text-anchor="middle" font-size="9" fill="#666">never anything else</text>

  <!-- Row 2: learned -->
  <text x="20" y="215" font-size="12" font-weight="bold" fill="#b91c1c">A CNN&#39;s way: the COMPUTER invents the numbers</text>

  <rect x="20" y="225" width="130" height="95" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="85" y="273" text-anchor="middle" font-size="26">🐱🐶🚗🌳...</text>
  <text x="85" y="305" text-anchor="middle" font-size="9" fill="#666">thousands of photos</text>

  <line x1="150" y1="272" x2="180" y2="272" stroke="#aaa" stroke-width="1.5" marker-end="url(#lfArrow)"/>

  <rect x="183" y="225" width="140" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="198" y="245" width="30" height="30" fill="#fee2e2" stroke="#dc2626"/><text x="213" y="265" fill="#b91c1c">?</text>
    <rect x="228" y="245" width="30" height="30" fill="#fee2e2" stroke="#dc2626"/><text x="243" y="265" fill="#b91c1c">?</text>
    <rect x="258" y="245" width="30" height="30" fill="#fee2e2" stroke="#dc2626"/><text x="273" y="265" fill="#b91c1c">?</text>
    <rect x="198" y="275" width="30" height="30" fill="#fecaca" stroke="#dc2626"/><text x="213" y="295" fill="#b91c1c">?</text>
    <rect x="228" y="275" width="30" height="30" fill="#fecaca" stroke="#dc2626"/><text x="243" y="295" fill="#b91c1c">?</text>
    <rect x="258" y="275" width="30" height="30" fill="#fecaca" stroke="#dc2626"/><text x="273" y="295" fill="#b91c1c">?</text>
  </g>
  <text x="253" y="313" text-anchor="middle" font-size="9" fill="#b91c1c">nobody wrote these</text>

  <line x1="323" y1="272" x2="353" y2="272" stroke="#aaa" stroke-width="1.5" marker-end="url(#lfArrow)"/>

  <rect x="356" y="225" width="150" height="95" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="431" y="265" text-anchor="middle" font-size="12" fill="#374151">Might find edges,</text>
  <text x="431" y="282" text-anchor="middle" font-size="12" fill="#374151">fur patches,</text>
  <text x="431" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">whatever helps</text>

  <!-- Right side summary -->
  <rect x="530" y="80" width="350" height="200" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="705" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Think of it like this</text>
  <text x="550" y="130" font-size="11" fill="#78350f">A hand-designed filter is like a</text>
  <text x="550" y="147" font-size="11" fill="#78350f">rubber stamp you carved yourself,</text>
  <text x="550" y="164" font-size="11" fill="#78350f">it only ever stamps one shape.</text>
  <text x="550" y="192" font-size="11" fill="#78350f">A learned filter is like asking a</text>
  <text x="550" y="209" font-size="11" fill="#78350f">robot to look at 10,000 photos and</text>
  <text x="550" y="226" font-size="11" fill="#78350f">invent its own rubber stamp, one</text>
  <text x="550" y="243" font-size="11" fill="#78350f">that turns out to be useful for</text>
  <text x="550" y="260" font-size="11" fill="#78350f">telling cats and dogs apart.</text>
</svg>
