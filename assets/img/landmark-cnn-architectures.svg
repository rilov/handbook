<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="920" height="300" fill="#f8f9fa" rx="12"/>
  <text x="460" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Landmark CNN Backbones: Each One Solved a Different Problem</text>

  <!-- Panel 1: AlexNet -->
  <rect x="20" y="45" width="210" height="230" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">AlexNet (2012)</text>
  <g>
    <rect x="45" y="90" width="18" height="70" fill="#93c5fd"/>
    <rect x="68" y="100" width="14" height="60" fill="#93c5fd"/>
    <rect x="87" y="108" width="12" height="52" fill="#93c5fd"/>
    <rect x="104" y="114" width="10" height="46" fill="#93c5fd"/>
    <rect x="119" y="118" width="60" height="38" fill="#bfdbfe"/>
    <rect x="184" y="122" width="30" height="30" fill="#bfdbfe"/>
  </g>
  <text x="125" y="180" text-anchor="middle" font-size="9" fill="#1e40af">deep + wide for its time</text>
  <text x="125" y="193" text-anchor="middle" font-size="9" fill="#1e40af">large kernels, ReLU,</text>
  <text x="125" y="206" text-anchor="middle" font-size="9" fill="#1e40af">dropout, trained on GPUs</text>
  <text x="125" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">Proved deep CNNs</text>
  <text x="125" y="241" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">scale with data + GPUs</text>

  <!-- Panel 2: VGG -->
  <rect x="245" y="45" width="210" height="230" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">VGGNet (2014)</text>
  <g fill="#86efac">
    <rect x="270" y="95" width="14" height="65"/><rect x="288" y="95" width="14" height="65"/>
    <rect x="310" y="102" width="12" height="55"/><rect x="326" y="102" width="12" height="55"/>
    <rect x="346" y="110" width="10" height="45"/><rect x="360" y="110" width="10" height="45"/>
    <rect x="378" y="118" width="9" height="35"/><rect x="391" y="118" width="9" height="35"/>
    <rect x="408" y="124" width="8" height="26"/><rect x="420" y="124" width="8" height="26"/>
  </g>
  <text x="350" y="180" text-anchor="middle" font-size="9" fill="#166534">many small 3x3 kernels</text>
  <text x="350" y="193" text-anchor="middle" font-size="9" fill="#166534">stacked in uniform blocks,</text>
  <text x="350" y="206" text-anchor="middle" font-size="9" fill="#166534">simple + very deep</text>
  <text x="350" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">Uniform depth = richer,</text>
  <text x="350" y="241" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">reusable features</text>

  <!-- Panel 3: GoogLeNet -->
  <rect x="470" y="45" width="210" height="230" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="575" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">GoogLeNet (2014)</text>
  <g fill="none" stroke="#f59e0b" stroke-width="1.5">
    <rect x="500" y="95" width="35" height="22"/><text x="517" y="110" text-anchor="middle" font-size="7.5" fill="#92400e">1x1</text>
    <rect x="500" y="122" width="35" height="22"/><text x="517" y="137" text-anchor="middle" font-size="7.5" fill="#92400e">3x3</text>
    <rect x="500" y="149" width="35" height="22"/><text x="517" y="164" text-anchor="middle" font-size="7.5" fill="#92400e">5x5</text>
    <rect x="500" y="176" width="35" height="22"/><text x="517" y="191" text-anchor="middle" font-size="7.5" fill="#92400e">pool</text>
  </g>
  <line x1="540" y1="106" x2="565" y2="145" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="540" y1="133" x2="565" y2="145" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="540" y1="160" x2="565" y2="145" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="540" y1="187" x2="565" y2="145" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="565" y="132" width="30" height="26" fill="#fed7aa" stroke="#d97706"/>
  <text x="580" y="149" text-anchor="middle" font-size="7" fill="#92400e">concat</text>
  <text x="575" y="180" text-anchor="middle" font-size="9" fill="#92400e">inception module:</text>
  <text x="575" y="193" text-anchor="middle" font-size="9" fill="#92400e">several kernel sizes run</text>
  <text x="575" y="206" text-anchor="middle" font-size="9" fill="#92400e">in parallel, then combined</text>
  <text x="575" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350f">Multi-scale patterns,</text>
  <text x="575" y="241" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350f">fewer parameters</text>

  <!-- Panel 4: ResNet -->
  <rect x="695" y="45" width="205" height="230" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="797" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#be185d">ResNet (2015)</text>
  <rect x="740" y="95" width="30" height="24" fill="#fbcfe8" stroke="#db2777"/>
  <text x="755" y="111" text-anchor="middle" font-size="7" fill="#9d174d">conv</text>
  <rect x="740" y="130" width="30" height="24" fill="#fbcfe8" stroke="#db2777"/>
  <text x="755" y="146" text-anchor="middle" font-size="7" fill="#9d174d">conv</text>
  <path d="M 725,95 L 715,95 L 715,150 L 738,150" fill="none" stroke="#db2777" stroke-width="1.8" marker-end="url(#resArrow)"/>
  <defs>
    <marker id="resArrow" markerWidth="7" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#db2777"/>
    </marker>
  </defs>
  <text x="797" y="180" text-anchor="middle" font-size="9" fill="#9d174d">skip connection carries</text>
  <text x="797" y="193" text-anchor="middle" font-size="9" fill="#9d174d">input past a block,</text>
  <text x="797" y="206" text-anchor="middle" font-size="9" fill="#9d174d">network learns a residual</text>
  <text x="797" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#831843">Hundreds of layers</text>
  <text x="797" y="241" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#831843">train reliably</text>

  <text x="460" y="290" text-anchor="middle" font-size="9" fill="#666">Each idea (scale, uniform depth, multi-scale parallelism, skip connections) reappears in later backbones — including the ones YOLO and SSD use.</text>
</svg>
