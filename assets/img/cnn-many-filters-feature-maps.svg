<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="880" height="320" fill="#f8f9fa" rx="12"/>
  <text x="440" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">One Photo, Many Filters, Many Feature Maps</text>
  <text x="440" y="44" text-anchor="middle" font-size="10.5" fill="#666">Each filter is like its own highlighter, hunting for one thing and marking only that</text>

  <defs>
    <marker id="fmArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- input photo -->
  <rect x="20" y="120" width="110" height="110" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="75" y="182" text-anchor="middle" font-size="34">🐈</text>
  <text x="75" y="248" text-anchor="middle" font-size="9" fill="#666">the photo</text>

  <line x1="130" y1="175" x2="165" y2="90" stroke="#aaa" stroke-width="1.3" marker-end="url(#fmArrow)"/>
  <line x1="130" y1="175" x2="165" y2="175" stroke="#aaa" stroke-width="1.3" marker-end="url(#fmArrow)"/>
  <line x1="130" y1="175" x2="165" y2="260" stroke="#aaa" stroke-width="1.3" marker-end="url(#fmArrow)"/>

  <!-- Filter 1: vertical edges -->
  <rect x="168" y="60" width="140" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="238" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Filter 1</text>
  <text x="238" y="98" text-anchor="middle" font-size="9.5" fill="#1d4ed8">"looking for edges"</text>

  <line x1="308" y1="90" x2="343" y2="90" stroke="#aaa" stroke-width="1.3" marker-end="url(#fmArrow)"/>

  <rect x="346" y="55" width="150" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="421" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8">Feature Map 1</text>
  <text x="421" y="94" text-anchor="middle" font-size="9" fill="#1d4ed8">bright where an edge was found</text>
  <text x="421" y="110" text-anchor="middle" font-size="16">▤▥▤</text>

  <!-- Filter 2: colour patches -->
  <rect x="168" y="145" width="140" height="60" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="238" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#9d174d">Filter 2</text>
  <text x="238" y="183" text-anchor="middle" font-size="9.5" fill="#9d174d">"looking for orange fur"</text>

  <line x1="308" y1="175" x2="343" y2="175" stroke="#aaa" stroke-width="1.3" marker-end="url(#fmArrow)"/>

  <rect x="346" y="140" width="150" height="70" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="421" y="163" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9d174d">Feature Map 2</text>
  <text x="421" y="179" text-anchor="middle" font-size="9" fill="#9d174d">bright where orange fur was found</text>
  <text x="421" y="197" text-anchor="middle" font-size="16">🟧🟧⬜</text>

  <!-- Filter 3: curves -->
  <rect x="168" y="230" width="140" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="238" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Filter 3</text>
  <text x="238" y="268" text-anchor="middle" font-size="9.5" fill="#15803d">"looking for rounded curves"</text>

  <line x1="308" y1="260" x2="343" y2="260" stroke="#aaa" stroke-width="1.3" marker-end="url(#fmArrow)"/>

  <rect x="346" y="225" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="421" y="248" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">Feature Map 3</text>
  <text x="421" y="264" text-anchor="middle" font-size="9" fill="#15803d">bright where curves were found</text>
  <text x="421" y="282" text-anchor="middle" font-size="16">◜◝◞</text>

  <!-- Stack representation -->
  <line x1="496" y1="90" x2="530" y2="150" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="496" y1="175" x2="530" y2="165" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="496" y1="260" x2="530" y2="180" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3"/>

  <rect x="600" y="90" width="90" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" transform="translate(0,60)"/>
  <rect x="615" y="105" width="90" height="30" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" transform="translate(0,50)"/>
  <rect x="630" y="120" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" transform="translate(0,40)"/>

  <text x="740" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">All the feature maps</text>
  <text x="740" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">stacked together</text>
  <text x="740" y="248" text-anchor="middle" font-size="9" fill="#666">this whole stack moves on</text>
  <text x="740" y="262" text-anchor="middle" font-size="9" fill="#666">to the next layer</text>
</svg>
