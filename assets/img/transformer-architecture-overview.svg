<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="650" fill="#f8f9fa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">The Transformer: the full blueprint</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#555">Left: the encoder reads the input. Right: the decoder writes the output, one word at a time.</text>

  <defs>
    <marker id="tfArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== ENCODER ===== -->
  <rect x="60" y="65" width="340" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="230" y="88" text-anchor="middle" font-size="11" fill="#334155">Input: Python program to print Hello World</text>
  <line x1="230" y1="101" x2="230" y2="117" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>

  <rect x="60" y="120" width="340" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="230" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">1. Input Embedding: each word becomes a vector</text>
  <line x1="230" y1="156" x2="230" y2="172" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>

  <rect x="60" y="175" width="340" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="230" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">2. + Positional Encoding: add word order</text>
  <line x1="230" y1="211" x2="230" y2="227" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>

  <rect x="60" y="230" width="340" height="200" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="75" y="250" font-size="12" font-weight="bold" fill="#1d4ed8">Encoder layer</text>
  <text x="385" y="250" text-anchor="end" font-size="10" fill="#1d4ed8">repeated × 6</text>

  <rect x="80" y="260" width="300" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="230" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">3. Multi-Head Self-Attention</text>
  <line x1="230" y1="300" x2="230" y2="307" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="80" y="310" width="300" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="230" y="326" text-anchor="middle" font-size="10" fill="#475569">Add &amp; Norm</text>
  <line x1="230" y1="334" x2="230" y2="341" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="80" y="344" width="300" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="230" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">4. Feed-Forward Network</text>
  <line x1="230" y1="384" x2="230" y2="391" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="80" y="394" width="300" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="230" y="410" text-anchor="middle" font-size="10" fill="#475569">Add &amp; Norm</text>

  <line x1="230" y1="430" x2="230" y2="452" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="60" y="455" width="340" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="478" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Output: z1 … z6 (rich meaning of every word)</text>

  <!-- encoder output to cross-attention -->
  <polyline points="400,473 450,473 450,364 517,364" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#tfArrow)"/>

  <!-- legend -->
  <text x="60" y="525" font-size="10" fill="#555">Add &amp; Norm = keep the original + learned info, then tidy the numbers</text>
  <text x="60" y="543" font-size="10" fill="#555">× 6 = the same layer design stacked 6 times (original paper)</text>
  <text x="60" y="561" font-size="10" fill="#555">Blue dashed line = the encoder's output is handed to the decoder</text>

  <!-- ===== DECODER ===== -->
  <rect x="500" y="65" width="340" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="670" y="88" text-anchor="middle" font-size="11" fill="#334155">Output so far: &lt;start&gt; print (</text>
  <line x1="670" y1="101" x2="670" y2="117" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>

  <rect x="500" y="120" width="340" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="670" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Output Embedding: each word becomes a vector</text>
  <line x1="670" y1="156" x2="670" y2="172" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>

  <rect x="500" y="175" width="340" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="670" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">+ Positional Encoding: add word order</text>
  <line x1="670" y1="211" x2="670" y2="227" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>

  <rect x="500" y="230" width="340" height="290" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="250" font-size="12" font-weight="bold" fill="#15803d">Decoder layer</text>
  <text x="825" y="250" text-anchor="end" font-size="10" fill="#15803d">repeated × 6</text>

  <rect x="520" y="260" width="300" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">5. Masked Self-Attention</text>
  <line x1="670" y1="300" x2="670" y2="307" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="520" y="310" width="300" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="670" y="326" text-anchor="middle" font-size="10" fill="#475569">Add &amp; Norm</text>
  <line x1="670" y1="334" x2="670" y2="341" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="520" y="344" width="300" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">6. Cross-Attention</text>
  <text x="670" y="376" text-anchor="middle" font-size="9" fill="#166534">looks at the encoder's z1 … z6</text>
  <line x1="670" y1="384" x2="670" y2="391" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="520" y="394" width="300" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="670" y="410" text-anchor="middle" font-size="10" fill="#475569">Add &amp; Norm</text>
  <line x1="670" y1="418" x2="670" y2="425" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="520" y="428" width="300" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Feed-Forward Network</text>
  <line x1="670" y1="468" x2="670" y2="475" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="520" y="478" width="300" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="670" y="494" text-anchor="middle" font-size="10" fill="#475569">Add &amp; Norm</text>

  <line x1="670" y1="520" x2="670" y2="542" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="500" y="545" width="340" height="36" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="670" y="568" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8">7. Linear + Softmax: score every possible next word</text>
  <line x1="670" y1="581" x2="670" y2="597" stroke="#888" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <rect x="500" y="600" width="340" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="670" y="621" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b21a8">Next word: "Hello World"</text>

  <!-- feedback loop -->
  <polyline points="840,616 868,616 868,83 843,83" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#tfArrow)"/>
  <text x="884" y="350" text-anchor="middle" font-size="10" fill="#6b21a8" transform="rotate(-90 884 350)">the new word is added to the output so far, and we repeat</text>
</svg>
