<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="700" height="340" fill="#f8f9fa" rx="12"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The Best-Fit Line Minimizes the Squared Errors</text>

  <defs>
    <marker id="lrAx" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#666"/>
    </marker>
  </defs>

  <line x1="80" y1="290" x2="80" y2="60" stroke="#666" stroke-width="1.5" marker-end="url(#lrAx)"/>
  <line x1="80" y1="290" x2="640" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#lrAx)"/>
  <text x="360" y="315" text-anchor="middle" font-size="11" fill="#555">square footage</text>
  <text x="35" y="175" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90 35 175)">house price</text>

  <!-- best fit line -->
  <line x1="100" y1="255" x2="600" y2="90" stroke="#2563eb" stroke-width="2.5"/>
  <text x="560" y="80" font-size="10.5" fill="#1d4ed8" font-weight="bold">best-fit line (ŷ)</text>

  <!-- data points with residual lines -->
  <circle cx="150" cy="220" r="5.5" fill="#111"/>
  <line x1="150" y1="220" x2="150" y2="238" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,2"/>

  <circle cx="230" cy="230" r="5.5" fill="#111"/>
  <line x1="230" y1="230" x2="230" y2="205" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,2"/>

  <circle cx="310" cy="170" r="5.5" fill="#111"/>
  <line x1="310" y1="170" x2="310" y2="180" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,2"/>

  <circle cx="390" cy="175" r="5.5" fill="#111"/>
  <line x1="390" y1="175" x2="390" y2="152" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,2"/>

  <circle cx="470" cy="105" r="5.5" fill="#111"/>
  <line x1="470" y1="105" x2="470" y2="123" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,2"/>

  <circle cx="540" cy="130" r="5.5" fill="#111"/>
  <line x1="540" y1="130" x2="540" y2="99" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,2"/>

  <!-- legend -->
  <circle cx="470" cy="230" r="5" fill="#111"/>
  <text x="483" y="234" font-size="10" fill="#333">actual price</text>
  <line x1="470" y1="255" x2="470" y2="255" stroke="#dc2626" stroke-width="0"/>
  <line x1="460" y1="253" x2="480" y2="253" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="483" y="257" font-size="10" fill="#333">error (residual)</text>

  <text x="350" y="335" text-anchor="middle" font-size="10" fill="#666">Cost = sum of the squared length of every red residual line — the fitted line makes this total as small as possible</text>
</svg>
