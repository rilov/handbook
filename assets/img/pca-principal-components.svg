<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="320" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">PCA Finds the Directions of Most Variation</text>

  <defs>
    <marker id="pcaAx" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Panel A: original axes with data cloud -->
  <text x="200" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Original features</text>

  <line x1="80" y1="280" x2="80" y2="70" stroke="#666" stroke-width="1.5" marker-end="url(#pcaAx)"/>
  <line x1="80" y1="280" x2="330" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#pcaAx)"/>
  <text x="205" y="300" text-anchor="middle" font-size="9.5" fill="#555">suspicious word count</text>
  <text x="35" y="175" text-anchor="middle" font-size="9.5" fill="#555" transform="rotate(-90 35 175)">link count</text>

  <circle cx="110" cy="250" r="5" fill="#4b5563"/>
  <circle cx="140" cy="225" r="5" fill="#4b5563"/>
  <circle cx="150" cy="240" r="5" fill="#4b5563"/>
  <circle cx="175" cy="205" r="5" fill="#4b5563"/>
  <circle cx="190" cy="215" r="5" fill="#4b5563"/>
  <circle cx="210" cy="185" r="5" fill="#4b5563"/>
  <circle cx="225" cy="195" r="5" fill="#4b5563"/>
  <circle cx="245" cy="165" r="5" fill="#4b5563"/>
  <circle cx="260" cy="150" r="5" fill="#4b5563"/>
  <circle cx="270" cy="170" r="5" fill="#4b5563"/>

  <!-- Panel B: same cloud with PC1/PC2 overlaid -->
  <text x="640" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">PCA rotates the axes to match the spread</text>

  <line x1="520" y1="280" x2="520" y2="70" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="520" y1="280" x2="770" y2="280" stroke="#d1d5db" stroke-width="1.2"/>

  <circle cx="550" cy="250" r="5" fill="#4b5563"/>
  <circle cx="580" cy="225" r="5" fill="#4b5563"/>
  <circle cx="590" cy="240" r="5" fill="#4b5563"/>
  <circle cx="615" cy="205" r="5" fill="#4b5563"/>
  <circle cx="630" cy="215" r="5" fill="#4b5563"/>
  <circle cx="650" cy="185" r="5" fill="#4b5563"/>
  <circle cx="665" cy="195" r="5" fill="#4b5563"/>
  <circle cx="685" cy="165" r="5" fill="#4b5563"/>
  <circle cx="700" cy="150" r="5" fill="#4b5563"/>
  <circle cx="710" cy="170" r="5" fill="#4b5563"/>

  <!-- PC1: long diagonal axis through the spread -->
  <line x1="535" y1="262" x2="725" y2="140" stroke="#dc2626" stroke-width="2.5"/>
  <text x="700" y="130" font-size="10.5" fill="#b91c1c" font-weight="bold">PC1 (most variance)</text>

  <!-- PC2: perpendicular -->
  <line x1="585" y1="150" x2="675" y2="255" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="255" font-size="10.5" fill="#1d4ed8" font-weight="bold">PC2</text>

  <!-- projection lines from a couple points onto PC1 -->
  <line x1="630" y1="215" x2="655" y2="200" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="700" y1="150" x2="685" y2="163" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="640" y="300" text-anchor="middle" font-size="10" fill="#666">Keep PC1, drop PC2 → 2D data compressed to 1D, keeping ~98% of the variance</text>
</svg>
