<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="780" height="380" fill="#f8f9fa" rx="12"/>
  <text x="390" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Decomposing a Time Series: Trend + Seasonality + Residual</text>

  <!-- Panel 1: Observed -->
  <text x="20" y="55" font-size="10.5" font-weight="bold" fill="#374151">Observed</text>
  <polyline points="60,70 100,55 140,75 180,50 220,80 260,45 300,85 340,42 380,90 420,40 460,95 500,38 540,98 580,55 620,60 660,50 700,58" fill="none" stroke="#111" stroke-width="1.8"/>

  <text x="730" y="65" font-size="16" fill="#666">=</text>

  <!-- Panel 2: Trend -->
  <text x="20" y="115" font-size="10.5" font-weight="bold" fill="#1d4ed8">Trend</text>
  <line x1="60" y1="140" x2="700" y2="90" stroke="#2563eb" stroke-width="2.2"/>

  <text x="730" y="120" font-size="16" fill="#666">+</text>

  <!-- Panel 3: Seasonality -->
  <text x="20" y="175" font-size="10.5" font-weight="bold" fill="#9d174d">Seasonality</text>
  <polyline points="60,180 90,160 120,180 150,160 180,180 210,160 240,180 270,160 300,180 330,160 360,180 390,160 420,180 450,160 480,180 510,160 540,180 570,160 600,180 630,160 660,180 690,160" fill="none" stroke="#db2777" stroke-width="2"/>

  <text x="730" y="175" font-size="16" fill="#666">+</text>

  <!-- Panel 4: Residual -->
  <text x="20" y="225" font-size="10.5" font-weight="bold" fill="#666">Residual (noise)</text>
  <polyline points="60,220 75,215 90,228 105,212 120,225 135,218 150,230 165,215 180,222 195,210 210,226 225,216 240,224 255,212 270,228 285,218 300,222 315,210 330,226 345,216 360,224 375,214 390,222 405,208 420,226 435,218 450,224 465,212 480,222 495,216 510,224 525,214 540,226 555,218 570,222 585,212 600,224 615,216 630,222 645,214 660,224 675,216 690,222" fill="none" stroke="#9ca3af" stroke-width="1.4"/>

  <line x1="0" y1="255" x2="780" y2="255" stroke="#d1d5db" stroke-width="1"/>

  <text x="390" y="285" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">What each piece answers</text>
  <text x="70" y="310" font-size="10" fill="#1d4ed8">Trend</text>
  <text x="70" y="325" font-size="9.5" fill="#374151">Is it going up, down, or flat overall?</text>

  <text x="330" y="310" font-size="10" fill="#9d174d">Seasonality</text>
  <text x="330" y="325" font-size="9.5" fill="#374151">Does it repeat at fixed intervals?</text>

  <text x="580" y="310" font-size="10" fill="#666">Residual</text>
  <text x="580" y="325" font-size="9.5" fill="#374151">What's left after removing both?</text>

  <text x="390" y="360" text-anchor="middle" font-size="10" fill="#666">Additive: the parts are added together. Multiplicative: the parts are multiplied instead (Section 7).</text>
</svg>
