<svg viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="290" fill="#f8f9fa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Positional Encoding: giving every word a seat number</text>

  <!-- Without positions -->
  <rect x="30" y="45" width="400" height="195" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="230" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">Without positions</text>
  <text x="230" y="98" text-anchor="middle" font-size="11" fill="#333">Sentence A: "dog bites man"</text>
  <text x="230" y="118" text-anchor="middle" font-size="11" fill="#333">Sentence B: "man bites dog"</text>
  <text x="230" y="146" text-anchor="middle" font-size="10" fill="#555">Attention sees both as the same bag of words:</text>
  <rect x="115" y="158" width="70" height="28" rx="6" fill="#fff" stroke="#ef4444"/>
  <text x="150" y="177" text-anchor="middle" font-size="11" fill="#333">dog</text>
  <rect x="195" y="158" width="70" height="28" rx="6" fill="#fff" stroke="#ef4444"/>
  <text x="230" y="177" text-anchor="middle" font-size="11" fill="#333">bites</text>
  <rect x="275" y="158" width="70" height="28" rx="6" fill="#fff" stroke="#ef4444"/>
  <text x="310" y="177" text-anchor="middle" font-size="11" fill="#333">man</text>
  <text x="230" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">✗ Both sentences look identical</text>

  <!-- With positions -->
  <rect x="470" y="45" width="400" height="195" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">With positional encoding</text>

  <text x="495" y="119" font-size="10" fill="#555">A:</text>
  <text x="590" y="96" text-anchor="middle" font-size="9" fill="#15803d">seat 1</text>
  <rect x="555" y="101" width="70" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="590" y="119" text-anchor="middle" font-size="11" fill="#166534">dog</text>
  <text x="670" y="96" text-anchor="middle" font-size="9" fill="#15803d">seat 2</text>
  <rect x="635" y="101" width="70" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="119" text-anchor="middle" font-size="11" fill="#166534">bites</text>
  <text x="750" y="96" text-anchor="middle" font-size="9" fill="#15803d">seat 3</text>
  <rect x="715" y="101" width="70" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="119" text-anchor="middle" font-size="11" fill="#166534">man</text>

  <text x="495" y="173" font-size="10" fill="#555">B:</text>
  <text x="590" y="150" text-anchor="middle" font-size="9" fill="#15803d">seat 1</text>
  <rect x="555" y="155" width="70" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="590" y="173" text-anchor="middle" font-size="11" fill="#166534">man</text>
  <text x="670" y="150" text-anchor="middle" font-size="9" fill="#15803d">seat 2</text>
  <rect x="635" y="155" width="70" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="173" text-anchor="middle" font-size="11" fill="#166534">bites</text>
  <text x="750" y="150" text-anchor="middle" font-size="9" fill="#15803d">seat 3</text>
  <rect x="715" y="155" width="70" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="173" text-anchor="middle" font-size="11" fill="#166534">dog</text>

  <text x="670" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">✓ Now the model knows who bit whom</text>

  <text x="450" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Input to the Transformer  =  word embedding (what it means)  +  position vector (where it sits)</text>
</svg>
