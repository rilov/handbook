<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="320" fill="#f8f9fa" rx="12"/>
  <text x="450" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">YOLO11: Backbone -&gt; Neck -&gt; Head</text>

  <defs>
    <marker id="y11Arrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Backbone -->
  <rect x="30" y="55" width="250" height="220" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Backbone (feature extractor)</text>

  <rect x="50" y="95" width="210" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="155" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">C3k2 blocks</text>
  <text x="155" y="134" text-anchor="middle" font-size="9" fill="#1e40af">CSP-style, two smaller</text>
  <text x="155" y="146" text-anchor="middle" font-size="9" fill="#1e40af">convolutions for efficiency</text>

  <rect x="50" y="165" width="210" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="155" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">C2PSA</text>
  <text x="155" y="204" text-anchor="middle" font-size="9" fill="#1e40af">Cross-stage partial +</text>
  <text x="155" y="216" text-anchor="middle" font-size="9" fill="#1e40af">spatial attention</text>

  <text x="155" y="250" text-anchor="middle" font-size="9" fill="#1e40af">raw pixels -&gt; compact</text>
  <text x="155" y="263" text-anchor="middle" font-size="9" fill="#1e40af">multi-scale feature maps</text>

  <line x1="285" y1="165" x2="325" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#y11Arrow)"/>

  <!-- Neck -->
  <rect x="330" y="55" width="240" height="220" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Neck (feature fusion)</text>

  <rect x="350" y="100" width="200" height="90" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">PAN + FPN</text>
  <text x="450" y="140" text-anchor="middle" font-size="9" fill="#166534">two-way highway:</text>
  <text x="450" y="153" text-anchor="middle" font-size="9" fill="#166534">deep semantics flow down,</text>
  <text x="450" y="166" text-anchor="middle" font-size="9" fill="#166534">sharp early detail flows up</text>
  <text x="450" y="179" text-anchor="middle" font-size="9" fill="#166534">so small objects aren't lost</text>

  <text x="450" y="215" text-anchor="middle" font-size="9" fill="#166534">combines high-res detail</text>
  <text x="450" y="228" text-anchor="middle" font-size="9" fill="#166534">with deep, high-level meaning</text>

  <line x1="575" y1="165" x2="615" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#y11Arrow)"/>

  <!-- Head -->
  <rect x="620" y="55" width="250" height="220" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="745" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Head (decoupled, anchor-free)</text>

  <rect x="640" y="98" width="95" height="70" rx="6" fill="#ffedd5" stroke="#d97706"/>
  <text x="687" y="122" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400e">Box branch</text>
  <text x="687" y="137" text-anchor="middle" font-size="8.5" fill="#92400e">predicts object</text>
  <text x="687" y="149" text-anchor="middle" font-size="8.5" fill="#92400e">centre directly</text>

  <rect x="745" y="98" width="105" height="70" rx="6" fill="#ffedd5" stroke="#d97706"/>
  <text x="797" y="122" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400e">Class branch</text>
  <text x="797" y="137" text-anchor="middle" font-size="8.5" fill="#92400e">separate from box</text>
  <text x="797" y="149" text-anchor="middle" font-size="8.5" fill="#92400e">branch -&gt; faster</text>
  <text x="797" y="161" text-anchor="middle" font-size="8.5" fill="#92400e">convergence</text>

  <text x="745" y="195" text-anchor="middle" font-size="9" fill="#92400e">no predefined anchor boxes -</text>
  <text x="745" y="208" text-anchor="middle" font-size="9" fill="#92400e">flexible for unusual shapes</text>
  <text x="745" y="230" text-anchor="middle" font-size="9" fill="#92400e">some variants run end-to-end</text>
  <text x="745" y="243" text-anchor="middle" font-size="9" fill="#92400e">with NMS removed entirely</text>

  <text x="450" y="300" text-anchor="middle" font-size="9.5" fill="#666">Same backbone/neck/head skeleton is reused, with small head changes, for detection, segmentation, pose, and classification.</text>
</svg>
