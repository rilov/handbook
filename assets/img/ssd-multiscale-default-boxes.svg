<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="360" fill="#f8f9fa" rx="12"/>
  <text x="450" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SSD: Default Boxes on Multiple Feature-Map Scales</text>

  <defs>
    <marker id="ssdArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- backbone flow arrow -->
  <line x1="70" y1="70" x2="830" y2="70" stroke="#bbb" stroke-width="1.5" marker-end="url(#ssdArrow)"/>
  <text x="450" y="60" text-anchor="middle" font-size="10.5" fill="#777">deeper into the network (extra conv layers after VGG-16)</text>

  <!-- Panel 1: early, high-res feature map, small default boxes -->
  <text x="180" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Early layer (e.g. 38x38)</text>
  <rect x="60" y="115" width="240" height="180" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="100" y1="115" x2="100" y2="295"/><line x1="140" y1="115" x2="140" y2="295"/>
    <line x1="180" y1="115" x2="180" y2="295"/><line x1="220" y1="115" x2="220" y2="295"/>
    <line x1="260" y1="115" x2="260" y2="295"/>
    <line x1="60" y1="151" x2="300" y2="151"/><line x1="60" y1="187" x2="300" y2="187"/>
    <line x1="60" y1="223" x2="300" y2="223"/><line x1="60" y1="259" x2="300" y2="259"/>
  </g>
  <!-- small default boxes at a couple of cells -->
  <g fill="none" stroke-width="1.5">
    <rect x="106" y="193" width="20" height="20" stroke="#dc2626"/>
    <rect x="102" y="197" width="28" height="12" stroke="#16a34a"/>
    <rect x="226" y="157" width="20" height="20" stroke="#dc2626"/>
    <rect x="222" y="161" width="28" height="12" stroke="#16a34a"/>
  </g>
  <text x="180" y="315" text-anchor="middle" font-size="9.5" fill="#666">many small cells -&gt; small default boxes</text>
  <text x="180" y="330" text-anchor="middle" font-size="9.5" fill="#1e3a8a" font-weight="bold">detects small objects</text>

  <!-- Panel 2: medium feature map, medium default boxes -->
  <text x="450" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Middle layer (e.g. 19x19)</text>
  <rect x="360" y="115" width="180" height="180" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="420" y1="115" x2="420" y2="295"/><line x1="480" y1="115" x2="480" y2="295"/>
    <line x1="360" y1="175" x2="540" y2="175"/><line x1="360" y1="235" x2="540" y2="235"/>
  </g>
  <g fill="none" stroke-width="1.5">
    <rect x="393" y="187" width="40" height="40" stroke="#dc2626"/>
    <rect x="385" y="197" width="56" height="24" stroke="#16a34a"/>
    <rect x="447" y="127" width="40" height="40" stroke="#dc2626"/>
    <rect x="439" y="137" width="56" height="24" stroke="#16a34a"/>
  </g>
  <text x="450" y="315" text-anchor="middle" font-size="9.5" fill="#666">fewer, bigger cells -&gt; medium default boxes</text>
  <text x="450" y="330" text-anchor="middle" font-size="9.5" fill="#1e3a8a" font-weight="bold">detects medium objects</text>

  <!-- Panel 3: late, coarse feature map, large default boxes -->
  <text x="700" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Late layer (e.g. 3x3)</text>
  <rect x="620" y="115" width="160" height="180" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="673" y1="115" x2="673" y2="295"/><line x1="727" y1="115" x2="727" y2="295"/>
    <line x1="620" y1="175" x2="780" y2="175"/><line x1="620" y1="235" x2="780" y2="235"/>
  </g>
  <g fill="none" stroke-width="1.5">
    <rect x="640" y="145" width="80" height="80" stroke="#dc2626"/>
    <rect x="628" y="163" width="104" height="44" stroke="#16a34a"/>
  </g>
  <text x="700" y="315" text-anchor="middle" font-size="9.5" fill="#666">few, large cells -&gt; large default boxes</text>
  <text x="700" y="330" text-anchor="middle" font-size="9.5" fill="#1e3a8a" font-weight="bold">detects large objects</text>

  <text x="450" y="352" text-anchor="middle" font-size="9.5" fill="#666">Each cell on each scale tries several default boxes (different aspect ratios), predicting class score + box offsets for every one.</text>
</svg>
