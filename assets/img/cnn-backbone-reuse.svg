<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="340" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">A Pretrained Backbone: One Set Of Notes, Reused For Many Jobs</text>
  <text x="450" y="44" text-anchor="middle" font-size="10.5" fill="#666">Like a photographer who takes one detailed photo, then hands prints to people who each use it differently</text>

  <defs>
    <marker id="bArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="20" y="130" width="90" height="80" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="65" y="180" text-anchor="middle" font-size="28">📷</text>
  <text x="65" y="222" text-anchor="middle" font-size="9" fill="#666">a new photo</text>

  <line x1="110" y1="170" x2="145" y2="170" stroke="#aaa" stroke-width="1.5" marker-end="url(#bArrow)"/>

  <!-- backbone -->
  <rect x="148" y="105" width="180" height="130" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="238" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">CNN Backbone</text>
  <text x="238" y="146" text-anchor="middle" font-size="9" fill="#3730a3">(conv + pool layers,</text>
  <text x="238" y="160" text-anchor="middle" font-size="9" fill="#3730a3">pretrained on ImageNet)</text>
  <text x="238" y="185" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4338ca">"Here's every edge,</text>
  <text x="238" y="200" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4338ca">texture, and part</text>
  <text x="238" y="215" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4338ca">I noticed"</text>

  <line x1="328" y1="170" x2="358" y2="170" stroke="#aaa" stroke-width="1.5" marker-end="url(#bArrow)"/>

  <rect x="361" y="140" width="90" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="406" y="166" text-anchor="middle" font-size="9" fill="#374151">feature</text>
  <text x="406" y="180" text-anchor="middle" font-size="9" fill="#374151">map</text>

  <!-- fan out to three tasks -->
  <line x1="451" y1="170" x2="490" y2="90" stroke="#aaa" stroke-width="1.3" marker-end="url(#bArrow)"/>
  <line x1="451" y1="170" x2="490" y2="170" stroke="#aaa" stroke-width="1.3" marker-end="url(#bArrow)"/>
  <line x1="451" y1="170" x2="490" y2="250" stroke="#aaa" stroke-width="1.3" marker-end="url(#bArrow)"/>

  <!-- task 1: classify -->
  <rect x="493" y="55" width="190" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="588" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">Classifier head</text>
  <text x="588" y="93" text-anchor="middle" font-size="9" fill="#b91c1c">"What is the main thing</text>
  <text x="588" y="107" text-anchor="middle" font-size="9" fill="#b91c1c">in this whole photo?"</text>

  <!-- task 2: detect -->
  <rect x="493" y="135" width="190" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="588" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Detector head</text>
  <text x="588" y="173" text-anchor="middle" font-size="9" fill="#15803d">"Where is each object,</text>
  <text x="588" y="187" text-anchor="middle" font-size="9" fill="#15803d">and what is it?" (Parts 4-9)</text>

  <!-- task 3: segment -->
  <rect x="493" y="215" width="190" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="588" y="236" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Segmentation head</text>
  <text x="588" y="253" text-anchor="middle" font-size="9" fill="#92400e">"Which exact pixels</text>
  <text x="588" y="267" text-anchor="middle" font-size="9" fill="#92400e">belong to each object?"</text>

  <!-- outputs -->
  <line x1="683" y1="90" x2="705" y2="90" stroke="#aaa" stroke-width="1.3" marker-end="url(#bArrow)"/>
  <text x="770" y="94" text-anchor="middle" font-size="16">🐱</text>
  <text x="770" y="108" text-anchor="middle" font-size="8" fill="#666">"cat"</text>

  <line x1="683" y1="170" x2="705" y2="170" stroke="#aaa" stroke-width="1.3" marker-end="url(#bArrow)"/>
  <rect x="740" y="155" width="60" height="30" rx="4" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="174" text-anchor="middle" font-size="14">🐱</text>

  <line x1="683" y1="250" x2="705" y2="250" stroke="#aaa" stroke-width="1.3" marker-end="url(#bArrow)"/>
  <text x="770" y="255" text-anchor="middle" font-size="16">✂️🐱</text>

  <text x="450" y="320" text-anchor="middle" font-size="10" fill="#666">The expensive part, learning to see, happens once. Only the small head on top is trained per task.</text>
</svg>
