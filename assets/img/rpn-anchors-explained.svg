<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="420" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">How The Region Proposal Network (RPN) Guesses "Look Here"</text>

  <defs>
    <marker id="rArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- feature map grid -->
  <text x="20" y="58" font-size="11" font-weight="bold" fill="#444">1. The shared feature map is a grid</text>
  <g stroke="#cbd5e1" stroke-width="1">
    <rect x="20" y="68" width="220" height="150" fill="#eef2ff"/>
    <line x1="64" y1="68" x2="64" y2="218"/>
    <line x1="108" y1="68" x2="108" y2="218"/>
    <line x1="152" y1="68" x2="152" y2="218"/>
    <line x1="196" y1="68" x2="196" y2="218"/>
    <line x1="20" y1="98" x2="240" y2="98"/>
    <line x1="20" y1="128" x2="240" y2="128"/>
    <line x1="20" y1="158" x2="240" y2="158"/>
    <line x1="20" y1="188" x2="240" y2="188"/>
  </g>
  <rect x="108" y="128" width="44" height="30" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="130" y="234" text-anchor="middle" font-size="8.5" fill="#666">one grid cell = one "sliding window" spot</text>

  <line x1="245" y1="143" x2="278" y2="143" stroke="#aaa" stroke-width="1.5" marker-end="url(#rArrow)"/>

  <!-- anchors at one point -->
  <text x="290" y="58" font-size="11" font-weight="bold" fill="#444">2. At that ONE spot, try 9 guess-boxes ("anchors")</text>
  <rect x="290" y="68" width="300" height="150" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <!-- 3 scales x 3 aspect ratios, drawn as overlapping rectangles from a common center -->
  <g stroke-width="2" fill="none">
    <rect x="410" y="103" width="70" height="70" stroke="#16a34a"/>
    <rect x="425" y="118" width="40" height="40" stroke="#16a34a"/>
    <rect x="393" y="128" width="104" height="30" stroke="#2563eb"/>
    <rect x="403" y="93" width="84" height="90" stroke="#2563eb" stroke-dasharray="3 2"/>
    <rect x="415" y="80" width="60" height="116" stroke="#d97706"/>
    <rect x="380" y="120" width="130" height="46" stroke="#db2777" stroke-dasharray="3 2"/>
  </g>
  <circle cx="445" cy="143" r="3" fill="#111"/>
  <text x="440" y="205" text-anchor="middle" font-size="8.5" fill="#666">3 sizes &#215; 3 shapes = 9 anchor boxes, all centered on the same spot</text>

  <!-- outputs -->
  <text x="20" y="270" font-size="11" font-weight="bold" fill="#444">3. For EACH of the 9 anchors, the network answers two quick questions</text>

  <rect x="20" y="280" width="410" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">"cls" — is something probably here?</text>
  <text x="225" y="325" text-anchor="middle" font-size="9.5" fill="#1e40af">object&#160;&#160;vs&#160;&#160;not an object</text>
  <text x="225" y="345" text-anchor="middle" font-size="9.5" fill="#1e40af">(an objectness score, like a confidence percent)</text>
  <text x="225" y="368" text-anchor="middle" font-size="9" fill="#3730a3">2 numbers per anchor</text>

  <rect x="450" y="280" width="410" height="110" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="655" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d174d">"reg" — nudge the box a little</text>
  <text x="655" y="325" text-anchor="middle" font-size="9.5" fill="#9d174d">shift it left/right/up/down,</text>
  <text x="655" y="345" text-anchor="middle" font-size="9.5" fill="#9d174d">stretch or shrink it slightly</text>
  <text x="655" y="368" text-anchor="middle" font-size="9" fill="#831843">4 numbers per anchor</text>

  <text x="450" y="410" text-anchor="middle" font-size="9.5" fill="#666">Do this at every grid spot, and one shared feature map gives tens of thousands of candidate boxes, almost for free.</text>
</svg>
