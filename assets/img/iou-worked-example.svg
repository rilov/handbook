<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="700" height="380" fill="#f8f9fa" rx="12"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">IoU Worked Example: Predicted Box vs Ground Truth</text>

  <!-- coordinate grid box -->
  <rect x="40" y="50" width="330" height="330" fill="#fff" stroke="#d1d5db" stroke-width="1"/>

  <!-- Box A: predicted, (10,10)-(60,60) -> scale 3px/unit, offset 40,50 -->
  <rect x="70" y="80" width="150" height="150" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.5"/>
  <text x="145" y="72" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-weight="bold">A: predicted (10,10)-(60,60)</text>

  <!-- Box B: ground truth, (30,30)-(80,80) -->
  <rect x="130" y="140" width="150" height="150" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2.5"/>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="bold">B: ground truth (30,30)-(80,80)</text>

  <!-- Intersection region (30,30)-(60,60) -->
  <rect x="130" y="140" width="90" height="90" fill="#f59e0b" fill-opacity="0.55" stroke="#d97706" stroke-width="2"/>
  <text x="175" y="190" text-anchor="middle" font-size="10" fill="#78350f" font-weight="bold">overlap</text>
  <text x="175" y="203" text-anchor="middle" font-size="9" fill="#78350f">30x30 = 900</text>

  <!-- Calculation panel -->
  <rect x="410" y="80" width="260" height="260" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">The Calculation</text>

  <text x="425" y="140" font-size="10.5" fill="#78350f">Area of A = 50 x 50 = 2500</text>
  <text x="425" y="163" font-size="10.5" fill="#78350f">Area of B = 50 x 50 = 2500</text>
  <text x="425" y="186" font-size="10.5" fill="#78350f">Overlap (A ∩ B) = 30 x 30 = 900</text>
  <text x="425" y="209" font-size="10.5" fill="#78350f">Union = 2500 + 2500 - 900 = 4100</text>

  <line x1="425" y1="225" x2="655" y2="225" stroke="#d97706" stroke-width="1"/>

  <text x="425" y="250" font-size="13" font-weight="bold" fill="#92400e">IoU = 900 / 4100</text>
  <text x="425" y="272" font-size="15" font-weight="bold" fill="#b45309">IoU ≈ 0.22</text>

  <text x="425" y="300" font-size="9.5" fill="#78350f">Below the common 0.5 threshold,</text>
  <text x="425" y="315" font-size="9.5" fill="#78350f">so this prediction would count</text>
  <text x="425" y="330" font-size="9.5" fill="#78350f">as a false positive, not a match.</text>
</svg>
