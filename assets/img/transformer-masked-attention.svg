<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="320" fill="#f8f9fa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Masked Self-Attention: no peeking at future words</text>
  <text x="450" y="47" text-anchor="middle" font-size="10.5" fill="#555">Each row is the word doing the looking. Each column is a word it might look at.</text>

  <text x="365" y="68" text-anchor="middle" font-size="10" fill="#555">can look at →</text>
  <!-- column labels -->
  <text x="225" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">&lt;start&gt;</text>
  <text x="295" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">print</text>
  <text x="365" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">(</text>
  <text x="435" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">"Hello World"</text>
  <text x="505" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">)</text>

  <!-- row labels -->
  <text x="180" y="113" text-anchor="end" font-size="10" font-weight="bold" fill="#333">&lt;start&gt;</text>
  <text x="180" y="147" text-anchor="end" font-size="10" font-weight="bold" fill="#333">print</text>
  <text x="180" y="181" text-anchor="end" font-size="10" font-weight="bold" fill="#333">(</text>
  <text x="180" y="215" text-anchor="end" font-size="10" font-weight="bold" fill="#333">"Hello World"</text>
  <text x="180" y="249" text-anchor="end" font-size="10" font-weight="bold" fill="#333">)</text>

  <g font-size="13" text-anchor="middle">
    <!-- row 1 -->
    <rect x="190" y="92" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="225" y="114" fill="#15803d">✓</text>
    <rect x="260" y="92" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="295" y="114" fill="#9ca3af">✗</text>
    <rect x="330" y="92" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="365" y="114" fill="#9ca3af">✗</text>
    <rect x="400" y="92" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="435" y="114" fill="#9ca3af">✗</text>
    <rect x="470" y="92" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="505" y="114" fill="#9ca3af">✗</text>
    <!-- row 2 -->
    <rect x="190" y="126" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="225" y="148" fill="#15803d">✓</text>
    <rect x="260" y="126" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="295" y="148" fill="#15803d">✓</text>
    <rect x="330" y="126" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="365" y="148" fill="#9ca3af">✗</text>
    <rect x="400" y="126" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="435" y="148" fill="#9ca3af">✗</text>
    <rect x="470" y="126" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="505" y="148" fill="#9ca3af">✗</text>
    <!-- row 3 -->
    <rect x="190" y="160" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="225" y="182" fill="#15803d">✓</text>
    <rect x="260" y="160" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="295" y="182" fill="#15803d">✓</text>
    <rect x="330" y="160" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="365" y="182" fill="#15803d">✓</text>
    <rect x="400" y="160" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="435" y="182" fill="#9ca3af">✗</text>
    <rect x="470" y="160" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="505" y="182" fill="#9ca3af">✗</text>
    <!-- row 4 -->
    <rect x="190" y="194" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="225" y="216" fill="#15803d">✓</text>
    <rect x="260" y="194" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="295" y="216" fill="#15803d">✓</text>
    <rect x="330" y="194" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="365" y="216" fill="#15803d">✓</text>
    <rect x="400" y="194" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="435" y="216" fill="#15803d">✓</text>
    <rect x="470" y="194" width="70" height="34" fill="#e5e7eb" stroke="#fff" stroke-width="2"/><text x="505" y="216" fill="#9ca3af">✗</text>
    <!-- row 5 -->
    <rect x="190" y="228" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="225" y="250" fill="#15803d">✓</text>
    <rect x="260" y="228" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="295" y="250" fill="#15803d">✓</text>
    <rect x="330" y="228" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="365" y="250" fill="#15803d">✓</text>
    <rect x="400" y="228" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="435" y="250" fill="#15803d">✓</text>
    <rect x="470" y="228" width="70" height="34" fill="#dcfce7" stroke="#fff" stroke-width="2"/><text x="505" y="250" fill="#15803d">✓</text>
  </g>

  <!-- explanation -->
  <rect x="570" y="92" width="305" height="170" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="588" y="116" font-size="12" font-weight="bold" fill="#333">Why the mask?</text>
  <text x="588" y="138" font-size="10.5" fill="#444">In training, the decoder is shown the whole</text>
  <text x="588" y="154" font-size="10.5" fill="#444">correct answer at once. Without a mask, the</text>
  <text x="588" y="170" font-size="10.5" fill="#444">word "print" could just peek at "(" and copy it.</text>
  <text x="588" y="198" font-size="12" font-weight="bold" fill="#333">Exam analogy</text>
  <text x="588" y="220" font-size="10.5" fill="#444">You may re-read what you have already</text>
  <text x="588" y="236" font-size="10.5" fill="#444">written, but not the answer key.</text>

  <text x="450" y="295" text-anchor="middle" font-size="11" fill="#555">Green = allowed. Grey = blocked (hidden). Every word sees itself and the words before it, never the words after it.</text>
</svg>
