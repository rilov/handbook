<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="300" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Stacking Layers: Simple Patterns Build Into Whole Objects</text>
  <text x="450" y="44" text-anchor="middle" font-size="10.5" fill="#666">Like building with LEGO: a few bricks first, then small parts, then the whole model</text>

  <defs>
    <marker id="hArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Layer 1: edges -->
  <rect x="20" y="70" width="150" height="160" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">Layer 1</text>
  <text x="95" y="106" text-anchor="middle" font-size="9.5" fill="#1d4ed8">edges &amp; colours</text>
  <text x="95" y="160" text-anchor="middle" font-size="30">╱ ╲ ─</text>
  <text x="95" y="200" text-anchor="middle" font-size="9" fill="#1d4ed8">"a line here"</text>
  <text x="95" y="214" text-anchor="middle" font-size="9" fill="#1d4ed8">"orange there"</text>

  <line x1="170" y1="150" x2="200" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#hArrow)"/>

  <!-- Layer 2: textures/parts -->
  <rect x="203" y="70" width="150" height="160" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="278" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9d174d">Layer 2</text>
  <text x="278" y="106" text-anchor="middle" font-size="9.5" fill="#9d174d">textures &amp; corners</text>
  <text x="278" y="160" text-anchor="middle" font-size="30">◜⌒◞</text>
  <text x="278" y="200" text-anchor="middle" font-size="9" fill="#9d174d">"a fuzzy patch"</text>
  <text x="278" y="214" text-anchor="middle" font-size="9" fill="#9d174d">"a rounded corner"</text>

  <line x1="353" y1="150" x2="383" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#hArrow)"/>

  <!-- Layer 3: object parts -->
  <rect x="386" y="70" width="150" height="160" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="461" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">Layer 3</text>
  <text x="461" y="106" text-anchor="middle" font-size="9.5" fill="#92400e">object parts</text>
  <text x="461" y="165" text-anchor="middle" font-size="34">👁️ 🐾</text>
  <text x="461" y="200" text-anchor="middle" font-size="9" fill="#92400e">"that looks like</text>
  <text x="461" y="214" text-anchor="middle" font-size="9" fill="#92400e">an eye, a paw"</text>

  <line x1="536" y1="150" x2="566" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#hArrow)"/>

  <!-- Layer 4: whole objects -->
  <rect x="569" y="70" width="150" height="160" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">Layer 4</text>
  <text x="644" y="106" text-anchor="middle" font-size="9.5" fill="#15803d">whole objects</text>
  <text x="644" y="170" text-anchor="middle" font-size="40">🐱</text>
  <text x="644" y="200" text-anchor="middle" font-size="9" fill="#15803d">"eyes + paws +</text>
  <text x="644" y="214" text-anchor="middle" font-size="9" fill="#15803d">fur pattern = cat!"</text>

  <line x1="719" y1="150" x2="749" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#hArrow)"/>

  <rect x="752" y="105" width="120" height="90" rx="8" fill="#fff" stroke="#374151" stroke-width="1.5"/>
  <text x="812" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">"It's a cat"</text>
  <text x="812" y="160" text-anchor="middle" font-size="10" fill="#374151">97% sure</text>

  <text x="450" y="270" text-anchor="middle" font-size="10" fill="#666">Early layers learn generic patterns useful almost everywhere. Deeper layers get more specific.</text>
</svg>
