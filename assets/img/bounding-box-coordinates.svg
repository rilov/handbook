<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="480" height="300" fill="#f8f9fa" rx="12"/>
  <text x="240" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Bounding Box Corner Coordinates</text>

  <!-- image frame with origin top-left -->
  <rect x="60" y="55" width="360" height="210" fill="#fff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="60" y="48" font-size="9.5" fill="#666">(0, 0)</text>
  <circle cx="60" cy="55" r="2.5" fill="#666"/>
  <text x="240" y="282" text-anchor="middle" font-size="9.5" fill="#666">x increases →</text>
  <text x="35" y="160" text-anchor="middle" font-size="9.5" fill="#666" transform="rotate(-90 35 160)">y increases →</text>

  <!-- bounding box -->
  <rect x="150" y="100" width="180" height="140" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="175" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="bold">object</text>

  <circle cx="150" cy="100" r="4" fill="#dc2626"/>
  <text x="150" y="92" text-anchor="middle" font-size="10.5" fill="#b91c1c" font-weight="bold">(x1, y1)</text>

  <circle cx="330" cy="240" r="4" fill="#dc2626"/>
  <text x="330" y="256" text-anchor="middle" font-size="10.5" fill="#b91c1c" font-weight="bold">(x2, y2)</text>

  <line x1="150" y1="100" x2="150" y2="240" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="130" y="175" text-anchor="middle" font-size="9.5" fill="#15803d" transform="rotate(-90 130 175)">height = y2 - y1</text>

  <line x1="150" y1="100" x2="330" y2="100" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="240" y="93" text-anchor="middle" font-size="9.5" fill="#15803d" opacity="0">width = x2 - x1</text>
  <text x="240" y="118" text-anchor="middle" font-size="9.5" fill="#15803d">width = x2 - x1</text>
</svg>
