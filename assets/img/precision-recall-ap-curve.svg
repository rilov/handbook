<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="620" height="340" fill="#f8f9fa" rx="12"/>
  <text x="310" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Precision-Recall Curve and Average Precision (AP)</text>

  <!-- axes -->
  <line x1="80" y1="280" x2="80" y2="55" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="280" x2="540" y2="280" stroke="#374151" stroke-width="1.5"/>
  <text x="310" y="315" text-anchor="middle" font-size="11" fill="#374151">Recall</text>
  <text x="30" y="167" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90 30 167)">Precision</text>

  <text x="80" y="295" text-anchor="middle" font-size="9" fill="#666">0</text>
  <text x="540" y="295" text-anchor="middle" font-size="9" fill="#666">1</text>
  <text x="70" y="284" text-anchor="end" font-size="9" fill="#666">0</text>
  <text x="70" y="60" text-anchor="end" font-size="9" fill="#666">1</text>

  <!-- shaded area under curve = AP -->
  <path d="M 80,90 C 160,92 220,100 280,130 C 340,160 380,220 420,240 C 460,258 500,268 540,272 L 540,280 L 80,280 Z"
        fill="#93c5fd" fill-opacity="0.45"/>

  <!-- PR curve -->
  <path d="M 80,90 C 160,92 220,100 280,130 C 340,160 380,220 420,240 C 460,258 500,268 540,272"
        fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

  <text x="250" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">AP = area under</text>
  <text x="250" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">the P-R curve</text>

  <!-- points showing sorting by confidence -->
  <circle cx="80" cy="90" r="3.5" fill="#1d4ed8"/>
  <text x="90" y="80" font-size="8.5" fill="#1e40af">highest-confidence</text>
  <text x="90" y="91" font-size="8.5" fill="#1e40af">predictions first</text>

  <circle cx="540" cy="272" r="3.5" fill="#1d4ed8"/>
  <text x="470" y="255" font-size="8.5" fill="#1e40af">lowest-confidence</text>
  <text x="480" y="266" font-size="8.5" fill="#1e40af">predictions last</text>

  <text x="310" y="330" text-anchor="middle" font-size="9.5" fill="#666">One curve per class (its AP); mAP is the average AP across all classes.</text>
</svg>
