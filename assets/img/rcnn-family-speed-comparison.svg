<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="430" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Same Photo, Three Ways of Finding Objects In It</text>

  <defs>
    <marker id="sArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Row 1: R-CNN -->
  <text x="20" y="60" font-size="12" font-weight="bold" fill="#444">R-CNN (2014)</text>
  <rect x="20" y="68" width="120" height="46" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="80" y="87" text-anchor="middle" font-size="9" fill="#333">Selective Search</text>
  <text x="80" y="100" text-anchor="middle" font-size="9" fill="#333">~2000 candidate boxes</text>

  <line x1="140" y1="91" x2="163" y2="91" stroke="#aaa" stroke-width="1.5" marker-end="url(#sArrow)"/>

  <rect x="166" y="68" width="330" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="331" y="87" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#991b1b">run the CNN separately ~2000 times,</text>
  <text x="331" y="100" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#991b1b">once per candidate box, one at a time</text>

  <text x="510" y="98" font-size="11" font-weight="bold" fill="#991b1b">very slow (tens of seconds per photo)</text>

  <!-- Row 2: Fast R-CNN -->
  <text x="20" y="160" font-size="12" font-weight="bold" fill="#444">Fast R-CNN (2015)</text>
  <rect x="20" y="168" width="120" height="46" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="80" y="187" text-anchor="middle" font-size="9" fill="#333">Selective Search</text>
  <text x="80" y="200" text-anchor="middle" font-size="9" fill="#333">(still slow, ~2 sec)</text>

  <line x1="140" y1="191" x2="163" y2="191" stroke="#aaa" stroke-width="1.5" marker-end="url(#sArrow)"/>

  <rect x="166" y="168" width="180" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="256" y="187" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e40af">CNN runs ONCE</text>
  <text x="256" y="200" text-anchor="middle" font-size="9" fill="#1e40af">shared feature map</text>

  <line x1="346" y1="191" x2="369" y2="191" stroke="#aaa" stroke-width="1.5" marker-end="url(#sArrow)"/>

  <rect x="372" y="168" width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="447" y="187" text-anchor="middle" font-size="9" fill="#1e40af">crop each box from</text>
  <text x="447" y="200" text-anchor="middle" font-size="9" fill="#1e40af">the shared map (RoI)</text>

  <text x="620" y="180" font-size="11" font-weight="bold" fill="#b45309">detector is fast now, but</text>
  <text x="620" y="196" font-size="11" font-weight="bold" fill="#b45309">still waits ~2 sec for boxes</text>

  <!-- Row 3: Faster R-CNN -->
  <text x="20" y="260" font-size="12" font-weight="bold" fill="#444">Faster R-CNN (this paper, 2015)</text>

  <rect x="20" y="268" width="240" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="288" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#166534">CNN runs ONCE</text>
  <text x="140" y="302" text-anchor="middle" font-size="9" fill="#166534">shared feature map</text>
  <text x="140" y="318" text-anchor="middle" font-size="9" fill="#166534">(same one used below, reused)</text>

  <line x1="260" y1="298" x2="283" y2="298" stroke="#aaa" stroke-width="1.5" marker-end="url(#sArrow)"/>

  <rect x="286" y="268" width="200" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="386" y="286" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#166534">RPN, a tiny extra part</text>
  <text x="386" y="300" text-anchor="middle" font-size="9" fill="#166534">of the SAME network,</text>
  <text x="386" y="314" text-anchor="middle" font-size="9" fill="#166534">proposes the boxes itself</text>

  <line x1="486" y1="298" x2="509" y2="298" stroke="#aaa" stroke-width="1.5" marker-end="url(#sArrow)"/>

  <rect x="512" y="268" width="150" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="587" y="292" text-anchor="middle" font-size="9" fill="#166534">crop each box from</text>
  <text x="587" y="306" text-anchor="middle" font-size="9" fill="#166534">the shared map (RoI)</text>

  <text x="700" y="290" font-size="11" font-weight="bold" fill="#166534">no separate slow step</text>
  <text x="700" y="306" font-size="11" font-weight="bold" fill="#166534">boxes cost ~10ms, nearly free</text>

  <!-- summary -->
  <rect x="20" y="360" width="840" height="55" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="440" y="382" text-anchor="middle" font-size="10.5" fill="#333">The only real change from Fast R-CNN to Faster R-CNN: the slow, hand-built "Selective Search" step</text>
  <text x="440" y="400" text-anchor="middle" font-size="10.5" fill="#333">is replaced by a small learned part of the network itself, the Region Proposal Network (RPN).</text>
</svg>
