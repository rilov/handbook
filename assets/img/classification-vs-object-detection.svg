<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="340" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Two Different Questions: "What Is This?" vs "Where Is It?"</text>

  <defs>
    <marker id="cdArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Row 1: Classification -->
  <text x="20" y="70" font-size="12" font-weight="bold" fill="#1d4ed8">Image Classification (a plain CNN)</text>

  <rect x="20" y="80" width="150" height="110" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="95" y="140" text-anchor="middle" font-size="34">🐶🐱🚗</text>
  <text x="95" y="178" text-anchor="middle" font-size="9" fill="#666">one whole photo</text>

  <line x1="170" y1="135" x2="205" y2="135" stroke="#aaa" stroke-width="1.5" marker-end="url(#cdArrow)"/>

  <rect x="208" y="80" width="150" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="283" y="130" text-anchor="middle" font-size="12" fill="#1d4ed8">CNN</text>
  <text x="283" y="150" text-anchor="middle" font-size="9" fill="#1d4ed8">looks at the</text>
  <text x="283" y="163" text-anchor="middle" font-size="9" fill="#1d4ed8">whole picture</text>

  <line x1="358" y1="135" x2="393" y2="135" stroke="#aaa" stroke-width="1.5" marker-end="url(#cdArrow)"/>

  <rect x="396" y="95" width="180" height="80" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="486" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">"There is a dog</text>
  <text x="486" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">somewhere in here"</text>
  <text x="486" y="160" text-anchor="middle" font-size="9" fill="#666">one label, no location</text>

  <!-- Row 2: Detection -->
  <text x="20" y="230" font-size="12" font-weight="bold" fill="#b91c1c">Object Detection (Faster R-CNN)</text>

  <rect x="20" y="240" width="150" height="90" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="35" y="255" width="45" height="55" rx="4" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="57" y="288" text-anchor="middle" font-size="20">🐶</text>
  <rect x="90" y="250" width="35" height="45" rx="4" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="107" y="278" text-anchor="middle" font-size="16">🐱</text>
  <rect x="128" y="265" width="35" height="40" rx="4" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="145" y="290" text-anchor="middle" font-size="16">🚗</text>

  <line x1="170" y1="285" x2="205" y2="285" stroke="#aaa" stroke-width="1.5" marker-end="url(#cdArrow)"/>

  <rect x="208" y="240" width="150" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="283" y="278" text-anchor="middle" font-size="12" fill="#b91c1c">Faster R-CNN</text>
  <text x="283" y="296" text-anchor="middle" font-size="9" fill="#b91c1c">finds every object</text>
  <text x="283" y="309" text-anchor="middle" font-size="9" fill="#b91c1c">and where it is</text>

  <line x1="358" y1="285" x2="393" y2="285" stroke="#aaa" stroke-width="1.5" marker-end="url(#cdArrow)"/>

  <rect x="396" y="240" width="380" height="90" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="586" y="266" text-anchor="middle" font-size="10.5" fill="#b91c1c">"dog" box at (35,255) &#160;&#160; "cat" box at (90,250)</text>
  <text x="586" y="286" text-anchor="middle" font-size="10.5" fill="#b91c1c">"car" box at (128,265) &#160;&#160; each with a confidence score</text>
  <text x="586" y="310" text-anchor="middle" font-size="9" fill="#666">one label AND one box per object found</text>
</svg>
