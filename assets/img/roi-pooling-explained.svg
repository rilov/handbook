<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="320" fill="#f8f9fa" rx="12"/>
  <text x="450" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RoI Pooling: From a Proposal Rectangle to a Fixed-Size Patch</text>

  <defs>
    <marker id="roiArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Panel 1: original image with proposal -->
  <text x="130" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Original image (800x600)</text>
  <rect x="30" y="70" width="200" height="150" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <rect x="70" y="105" width="90" height="60" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-size="8.5" fill="#b91c1c" font-weight="bold">proposal</text>
  <text x="130" y="240" text-anchor="middle" font-size="9" fill="#666">(160, 120, 320, 240)</text>
  <text x="130" y="253" text-anchor="middle" font-size="9" fill="#666">in image pixels</text>

  <line x1="235" y1="145" x2="275" y2="145" stroke="#aaa" stroke-width="1.5" marker-end="url(#roiArrow)"/>
  <text x="255" y="135" text-anchor="middle" font-size="8.5" fill="#777">CNN stride 16</text>

  <!-- Panel 2: feature map with mapped region -->
  <text x="400" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Feature map (50x38)</text>
  <rect x="280" y="70" width="200" height="150" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <g stroke="#e5e7eb" stroke-width="0.6">
    <line x1="320" y1="70" x2="320" y2="220"/><line x1="360" y1="70" x2="360" y2="220"/>
    <line x1="400" y1="70" x2="400" y2="220"/><line x1="440" y1="70" x2="440" y2="220"/>
    <line x1="280" y1="107" x2="480" y2="107"/><line x1="280" y1="145" x2="480" y2="145"/>
    <line x1="280" y1="182" x2="480" y2="182"/>
  </g>
  <rect x="320" y="107" width="70" height="45" fill="#fecaca" fill-opacity="0.5" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-size="9" fill="#666">maps to (10, 7, 20, 15)</text>
  <text x="400" y="253" text-anchor="middle" font-size="9" fill="#666">in feature-map cells</text>

  <line x1="485" y1="145" x2="525" y2="145" stroke="#aaa" stroke-width="1.5" marker-end="url(#roiArrow)"/>
  <text x="505" y="135" text-anchor="middle" font-size="8.5" fill="#777">RoI pool</text>

  <!-- Panel 3: pooled fixed-size patch -->
  <text x="700" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Pooled patch (fixed 7x7)</text>
  <rect x="620" y="80" width="160" height="130" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <g stroke="#bfdbfe" stroke-width="1">
    <line x1="643" y1="80" x2="643" y2="210"/><line x1="666" y1="80" x2="666" y2="210"/>
    <line x1="689" y1="80" x2="689" y2="210"/><line x1="712" y1="80" x2="712" y2="210"/>
    <line x1="735" y1="80" x2="735" y2="210"/><line x1="758" y1="80" x2="758" y2="210"/>
    <line x1="620" y1="98.5" x2="780" y2="98.5"/><line x1="620" y1="117" x2="780" y2="117"/>
    <line x1="620" y1="135.5" x2="780" y2="135.5"/><line x1="620" y1="154" x2="780" y2="154"/>
    <line x1="620" y1="172.5" x2="780" y2="172.5"/><line x1="620" y1="191" x2="780" y2="191"/>
  </g>
  <text x="700" y="230" text-anchor="middle" font-size="9" fill="#666">always 7x7, no matter</text>
  <text x="700" y="243" text-anchor="middle" font-size="9" fill="#666">the proposal's original size</text>

  <text x="450" y="285" text-anchor="middle" font-size="9.5" fill="#666">Every proposal, whatever its shape on the feature map, is bucketed into the same 7x7 grid and max-pooled per bucket -</text>
  <text x="450" y="298" text-anchor="middle" font-size="9.5" fill="#666">so the classifier and box regressor always receive a fixed-size input.</text>
</svg>
