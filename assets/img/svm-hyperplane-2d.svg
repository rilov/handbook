<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="340" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">A Hyperplane Is a Decision Boundary, Not a Prediction Line</text>

  <defs>
    <marker id="svmAx" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Panel A: single hyperplane -->
  <text x="200" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">One hyperplane, two regions</text>

  <line x1="70" y1="290" x2="70" y2="70" stroke="#666" stroke-width="1.5" marker-end="url(#svmAx)"/>
  <line x1="70" y1="290" x2="330" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#svmAx)"/>
  <text x="200" y="312" text-anchor="middle" font-size="9.5" fill="#555">x1 = word_freq_technology</text>
  <text x="30" y="180" text-anchor="middle" font-size="9.5" fill="#555" transform="rotate(-90 30 180)">x2 = word_freq_money</text>

  <!-- separating line: from (90,110) to (300,250) roughly -->
  <line x1="85" y1="95" x2="310" y2="270" stroke="#111" stroke-width="2"/>
  <text x="245" y="140" font-size="9" fill="#111" transform="rotate(38 245 140)">W0 + W1·x1 + W2·x2 = 0</text>

  <!-- spam points above/left of line -->
  <circle cx="110" cy="100" r="6" fill="#ef4444"/>
  <circle cx="140" cy="130" r="6" fill="#ef4444"/>
  <circle cx="95" cy="150" r="6" fill="#ef4444"/>
  <circle cx="160" cy="105" r="6" fill="#ef4444"/>
  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="bold">spam (+)</text>

  <!-- not-spam points below/right of line -->
  <rect x="220" y="200" width="12" height="12" fill="#2563eb"/>
  <rect x="250" y="230" width="12" height="12" fill="#2563eb"/>
  <rect x="280" y="190" width="12" height="12" fill="#2563eb"/>
  <rect x="200" y="250" width="12" height="12" fill="#2563eb"/>
  <text x="255" y="270" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="bold">not spam (−)</text>

  <!-- Panel B: many hyperplanes -->
  <text x="640" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Many valid lines separate the same data</text>

  <line x1="510" y1="290" x2="510" y2="70" stroke="#666" stroke-width="1.5" marker-end="url(#svmAx)"/>
  <line x1="510" y1="290" x2="770" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#svmAx)"/>

  <!-- same-ish points -->
  <circle cx="550" cy="100" r="6" fill="#ef4444"/>
  <circle cx="580" cy="130" r="6" fill="#ef4444"/>
  <circle cx="535" cy="150" r="6" fill="#ef4444"/>
  <circle cx="600" cy="105" r="6" fill="#ef4444"/>

  <rect x="660" y="200" width="12" height="12" fill="#2563eb"/>
  <rect x="690" y="230" width="12" height="12" fill="#2563eb"/>
  <rect x="720" y="190" width="12" height="12" fill="#2563eb"/>
  <rect x="640" y="250" width="12" height="12" fill="#2563eb"/>

  <!-- three candidate lines -->
  <line x1="525" y1="90" x2="750" y2="265" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="525" y1="115" x2="750" y2="245" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="525" y1="70" x2="720" y2="280" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5,3"/>

  <text x="640" y="308" text-anchor="middle" font-size="10" fill="#666">All three separate the classes correctly — which is best?</text>

  <rect x="500" y="20" width="0" height="0"/>
  <text x="640" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Answered in Part 2: the Maximal Margin Classifier</text>

  <line x1="410" y1="60" x2="410" y2="300" stroke="#e5e7eb" stroke-width="1"/>
</svg>
