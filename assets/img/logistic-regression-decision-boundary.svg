<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="640" height="340" fill="#f8f9fa" rx="12"/>
  <text x="320" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The Decision Boundary: Where the Model Is 50/50 Uncertain</text>

  <defs>
    <marker id="lgAx" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#666"/>
    </marker>
  </defs>

  <line x1="80" y1="290" x2="80" y2="60" stroke="#666" stroke-width="1.5" marker-end="url(#lgAx)"/>
  <line x1="80" y1="290" x2="580" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#lgAx)"/>
  <text x="330" y="315" text-anchor="middle" font-size="11" fill="#555">tenure (months)</text>
  <text x="35" y="175" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90 35 175)">monthly charges ($)</text>

  <!-- decision boundary line -->
  <line x1="200" y1="70" x2="420" y2="280" stroke="#111" stroke-width="2.5"/>
  <text x="243" y="105" font-size="10.5" fill="#111" font-weight="bold" transform="rotate(66 243 105)">decision boundary (P = 0.5)</text>

  <!-- churned points, upper-left region, high charge / short tenure -->
  <circle cx="130" cy="100" r="6" fill="#dc2626"/>
  <circle cx="160" cy="90" r="6" fill="#dc2626"/>
  <circle cx="150" cy="130" r="6" fill="#dc2626"/>
  <circle cx="180" cy="115" r="6" fill="#dc2626"/>
  <circle cx="200" cy="140" r="6" fill="#dc2626"/>
  <circle cx="170" cy="160" r="6" fill="#dc2626"/>
  <text x="160" y="75" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="bold">churned</text>

  <!-- loyal points, lower-right region, low charge / long tenure -->
  <circle cx="380" cy="245" r="6" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="420" cy="230" r="6" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="450" cy="255" r="6" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="470" cy="215" r="6" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="500" cy="240" r="6" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="440" cy="270" r="6" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="200" text-anchor="middle" font-size="10" fill="#15803d" font-weight="bold">loyal</text>

  <text x="320" y="330" text-anchor="middle" font-size="10" fill="#666">Everything left of the line is predicted "churn", everything right is predicted "loyal"</text>
</svg>
