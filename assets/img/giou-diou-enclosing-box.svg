<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="700" height="340" fill="#f8f9fa" rx="12"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">GIoU and DIoU: What to Do When Boxes Don't Overlap At All</text>

  <!-- enclosing box C -->
  <rect x="70" y="70" width="420" height="220" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="90" y="62" font-size="11" fill="#7e22ce" font-weight="bold">smallest enclosing box C</text>

  <!-- empty space between the two boxes (GIoU penalty) -->
  <rect x="200" y="70" width="130" height="220" fill="#fef08a" fill-opacity="0.5"/>
  <text x="265" y="240" text-anchor="middle" font-size="10" fill="#854d0e" font-weight="bold">empty space</text>
  <text x="265" y="255" text-anchor="middle" font-size="9" fill="#854d0e">penalised by GIoU</text>

  <!-- Box A -->
  <rect x="90" y="110" width="110" height="130" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.5"/>
  <text x="145" y="100" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-weight="bold">A (predicted)</text>
  <circle cx="145" cy="175" r="3.5" fill="#1d4ed8"/>

  <!-- Box B -->
  <rect x="330" y="140" width="130" height="110" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2.5"/>
  <text x="395" y="270" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="bold">B (ground truth)</text>
  <circle cx="395" cy="195" r="3.5" fill="#15803d"/>

  <!-- centre distance line for DIoU -->
  <line x1="145" y1="175" x2="395" y2="195" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="270" y="165" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="bold">ρ, centre distance</text>
  <text x="270" y="178" text-anchor="middle" font-size="9" fill="#b91c1c">penalised by DIoU</text>

  <!-- right side notes -->
  <rect x="520" y="80" width="160" height="200" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="600" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">IoU alone</text>
  <text x="600" y="120" text-anchor="middle" font-size="9" fill="#374151">no overlap → 0</text>
  <text x="600" y="134" text-anchor="middle" font-size="9" fill="#374151">gradient = 0, stuck</text>

  <text x="600" y="165" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7e22ce">+ GIoU</text>
  <text x="600" y="183" text-anchor="middle" font-size="9" fill="#374151">shrink the empty</text>
  <text x="600" y="197" text-anchor="middle" font-size="9" fill="#374151">space in C</text>

  <text x="600" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">+ DIoU / CIoU</text>
  <text x="600" y="246" text-anchor="middle" font-size="9" fill="#374151">also pull centres</text>
  <text x="600" y="260" text-anchor="middle" font-size="9" fill="#374151">together directly</text>

  <text x="350" y="320" text-anchor="middle" font-size="10" fill="#666">Each newer loss adds a term so the model still gets a useful signal even with zero overlap</text>
</svg>
