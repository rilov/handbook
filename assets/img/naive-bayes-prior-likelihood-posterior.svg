<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="300" fill="#f8f9fa" rx="12"/>
  <text x="430" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">From Prior and Likelihood to a Posterior Verdict</text>

  <defs>
    <marker id="nbArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Prior -->
  <rect x="20" y="70" width="180" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Prior: P(C)</text>
  <text x="110" y="112" text-anchor="middle" font-size="9.5" fill="#1d4ed8">How common is this</text>
  <text x="110" y="126" text-anchor="middle" font-size="9.5" fill="#1d4ed8">class overall?</text>
  <text x="110" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">P(spam) = 0.30</text>
  <text x="110" y="178" text-anchor="middle" font-size="9" fill="#1d4ed8">30% of all email is spam,</text>
  <text x="110" y="191" text-anchor="middle" font-size="9" fill="#1d4ed8">before reading a single word</text>

  <text x="215" y="140" font-size="20" fill="#666" text-anchor="middle">×</text>

  <!-- Likelihood -->
  <rect x="240" y="70" width="220" height="130" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="350" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d174d">Likelihood: P(X | C)</text>
  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#9d174d">How likely are these words,</text>
  <text x="350" y="126" text-anchor="middle" font-size="9.5" fill="#9d174d">if it really is spam?</text>
  <text x="350" y="150" text-anchor="middle" font-size="10" fill="#831843">P("free"|spam) = 0.80</text>
  <text x="350" y="166" text-anchor="middle" font-size="10" fill="#831843">P("won"|spam) = 0.60</text>
  <text x="350" y="182" text-anchor="middle" font-size="10" fill="#831843">P("Congrats"|spam) = 0.55</text>

  <text x="475" y="140" font-size="20" fill="#666" text-anchor="middle">→</text>

  <!-- Posterior -->
  <rect x="500" y="70" width="200" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Posterior: P(C | X)</text>
  <text x="600" y="112" text-anchor="middle" font-size="9.5" fill="#15803d">Updated belief, now that</text>
  <text x="600" y="126" text-anchor="middle" font-size="9.5" fill="#15803d">we've seen the words</text>
  <text x="600" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">score(spam) is high</text>
  <text x="600" y="178" text-anchor="middle" font-size="9" fill="#15803d">→ classify as spam</text>

  <line x1="200" y1="135" x2="235" y2="135" stroke="#aaa" stroke-width="1.6" marker-end="url(#nbArrow)"/>
  <line x1="460" y1="135" x2="495" y2="135" stroke="#aaa" stroke-width="1.6" marker-end="url(#nbArrow)"/>

  <!-- naive independence footnote -->
  <rect x="20" y="230" width="680" height="55" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">The "naive" part</text>
  <text x="360" y="270" text-anchor="middle" font-size="9.5" fill="#78350f">Each word's likelihood is multiplied in separately, assuming words don't influence each other once the class is known</text>
</svg>
