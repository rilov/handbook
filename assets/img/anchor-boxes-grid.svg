<svg viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="880" height="340" fill="#f8f9fa" rx="12"/>
  <text x="440" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Anchor Boxes: Several Shapes, Tried at Every Location</text>

  <defs>
    <marker id="abArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Panel A: multiple anchor shapes at one point -->
  <text x="200" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">5 anchor shapes, same centre point</text>

  <rect x="60" y="80" width="280" height="220" fill="#fff" stroke="#d1d5db" stroke-width="1"/>

  <!-- centre point -->
  <circle cx="200" cy="190" r="3" fill="#111"/>

  <!-- Anchor C, large square -->
  <rect x="145" y="135" width="110" height="110" fill="none" stroke="#9333ea" stroke-width="2"/>
  <text x="255" y="130" font-size="9" fill="#9333ea" font-weight="bold">C 128x128</text>

  <!-- Anchor B, medium square -->
  <rect x="168" y="158" width="64" height="64" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="155" font-size="9" fill="#2563eb" font-weight="bold">B 64x64</text>

  <!-- Anchor A, small square -->
  <rect x="184" y="174" width="32" height="32" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="185" font-size="9" fill="#16a34a" font-weight="bold">A 32x32</text>

  <!-- Anchor D, tall -->
  <rect x="184" y="158" width="32" height="64" fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="60" y="270" font-size="9" fill="#db2777" font-weight="bold">D 32x64 (tall)</text>

  <!-- Anchor E, wide -->
  <rect x="168" y="174" width="64" height="32" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="255" y="290" font-size="9" fill="#d97706" font-weight="bold">E 64x32 (wide)</text>

  <text x="200" y="325" text-anchor="middle" font-size="9.5" fill="#666">3 scales x 3 ratios (here simplified to 5) = k anchors per cell</text>

  <!-- Panel B: grid tiling across the feature map -->
  <text x="660" y="55" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">Repeated at every feature-map cell</text>

  <rect x="500" y="80" width="320" height="220" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <!-- grid lines -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="580" y1="80" x2="580" y2="300"/>
    <line x1="660" y1="80" x2="660" y2="300"/>
    <line x1="740" y1="80" x2="740" y2="300"/>
    <line x1="500" y1="153" x2="820" y2="153"/>
    <line x1="500" y1="227" x2="820" y2="227"/>
  </g>

  <!-- small anchor sets at a few cells -->
  <g stroke="#6b7280" stroke-width="1.2" fill="none">
    <rect x="528" y="105" width="24" height="24"/>
    <rect x="522" y="99" width="36" height="36"/>
    <rect x="608" y="167" width="24" height="24"/>
    <rect x="602" y="161" width="36" height="36"/>
    <rect x="688" y="245" width="24" height="24"/>
    <rect x="682" y="239" width="36" height="36"/>
    <rect x="768" y="120" width="24" height="24"/>
    <rect x="762" y="114" width="36" height="36"/>
    <rect x="768" y="270" width="24" height="24"/>
    <rect x="762" y="264" width="36" height="36"/>
  </g>

  <text x="660" y="325" text-anchor="middle" font-size="9.5" fill="#666">50 x 37 cells x 9 anchors = 16,650 anchors for one 800x600 image</text>
</svg>
