<svg viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="920" height="260" fill="#f8f9fa" rx="12"/>
  <text x="460" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The YOLO Family: One Idea, Ten Years of Refinement</text>

  <line x1="50" y1="130" x2="870" y2="130" stroke="#9ca3af" stroke-width="2"/>

  <!-- version stops -->
  <g font-size="9" text-anchor="middle">
    <!-- v1 -->
    <circle cx="60" cy="130" r="5" fill="#dc2626"/>
    <text x="60" y="115" fill="#b91c1c" font-weight="bold">v1 2016</text>
    <text x="60" y="150" fill="#444">grid + 2</text>
    <text x="60" y="161" fill="#444">boxes/cell</text>

    <!-- v2 -->
    <circle cx="160" cy="130" r="5" fill="#d97706"/>
    <text x="160" y="115" fill="#b45309" font-weight="bold">v2 2017</text>
    <text x="160" y="150" fill="#444">k-means</text>
    <text x="160" y="161" fill="#444">anchors</text>

    <!-- v3 -->
    <circle cx="260" cy="130" r="5" fill="#ca8a04"/>
    <text x="260" y="115" fill="#92400e" font-weight="bold">v3 2018</text>
    <text x="260" y="150" fill="#444">3-scale</text>
    <text x="260" y="161" fill="#444">detection</text>

    <!-- v4 -->
    <circle cx="360" cy="130" r="5" fill="#65a30d"/>
    <text x="360" y="115" fill="#3f6212" font-weight="bold">v4 2020</text>
    <text x="360" y="150" fill="#444">bag of</text>
    <text x="360" y="161" fill="#444">freebies</text>

    <!-- v5 -->
    <circle cx="440" cy="130" r="5" fill="#16a34a"/>
    <text x="440" y="115" fill="#15803d" font-weight="bold">v5 2020</text>
    <text x="440" y="150" fill="#444">PyTorch,</text>
    <text x="440" y="161" fill="#444">easy training</text>

    <!-- v6 -->
    <circle cx="520" cy="130" r="5" fill="#0d9488"/>
    <text x="520" y="115" fill="#0f766e" font-weight="bold">v6 2022</text>
    <text x="520" y="150" fill="#444">industrial,</text>
    <text x="520" y="161" fill="#444">RepVGG</text>

    <!-- v7 -->
    <circle cx="600" cy="130" r="5" fill="#0369a1"/>
    <text x="600" y="115" fill="#075985" font-weight="bold">v7 2022</text>
    <text x="600" y="150" fill="#444">re-param.</text>
    <text x="600" y="161" fill="#444">compound scale</text>

    <!-- v8 -->
    <circle cx="690" cy="130" r="5" fill="#3730a3"/>
    <text x="690" y="115" fill="#312e81" font-weight="bold">v8 2023</text>
    <text x="690" y="150" fill="#444">anchor-free,</text>
    <text x="690" y="161" fill="#444">C2f, multi-task</text>

    <!-- v9/v10 -->
    <circle cx="780" cy="130" r="5" fill="#7e22ce"/>
    <text x="780" y="115" fill="#6b21a8" font-weight="bold">v9/v10 2024</text>
    <text x="780" y="150" fill="#444">PGI, NMS-free</text>
    <text x="780" y="161" fill="#444">training</text>

    <!-- v11 -->
    <circle cx="860" cy="130" r="6" fill="#be185d"/>
    <text x="855" y="115" fill="#9d174d" font-weight="bold">YOLO11 2024</text>
    <text x="855" y="150" fill="#444">C3k2 + C2PSA,</text>
    <text x="855" y="161" fill="#444">decoupled head</text>
  </g>

  <text x="460" y="200" text-anchor="middle" font-size="10.5" fill="#374151" font-weight="bold">Across every version: one forward pass predicts all boxes, scores, and classes.</text>
  <text x="460" y="220" text-anchor="middle" font-size="9.5" fill="#666">Each release chases the same handful of goals — smaller/overlapping objects, more scales, faster training, less post-processing.</text>
</svg>
