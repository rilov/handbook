<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="330" fill="#f8f9fa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Multi-Head Attention: several discussions at the same time</text>
  <text x="450" y="46" text-anchor="middle" font-size="10.5" fill="#555">How much the word "program" listens to each word, in three different heads (illustrative numbers; each head adds up to 1)</text>

  <!-- Head 1 -->
  <rect x="30" y="58" width="265" height="200" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="162" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Head 1: meaning</text>
  <text x="162" y="97" text-anchor="middle" font-size="9.5" fill="#1e40af">"What kind of program am I?"</text>
  <text x="45" y="120" font-size="10.5" fill="#333">Python</text><rect x="115" y="110" width="110" height="13" rx="3" fill="#3b82f6"/><text x="230" y="120" font-size="9.5" fill="#333">0.55</text>
  <text x="45" y="144" font-size="10.5" fill="#333">program</text><rect x="115" y="134" width="50" height="13" rx="3" fill="#3b82f6"/><text x="170" y="144" font-size="9.5" fill="#333">0.25</text>
  <text x="45" y="168" font-size="10.5" fill="#333">to</text><rect x="115" y="158" width="4" height="13" rx="2" fill="#3b82f6"/><text x="124" y="168" font-size="9.5" fill="#333">0.02</text>
  <text x="45" y="192" font-size="10.5" fill="#333">print</text><rect x="115" y="182" width="16" height="13" rx="3" fill="#3b82f6"/><text x="136" y="192" font-size="9.5" fill="#333">0.08</text>
  <text x="45" y="216" font-size="10.5" fill="#333">Hello</text><rect x="115" y="206" width="10" height="13" rx="3" fill="#3b82f6"/><text x="130" y="216" font-size="9.5" fill="#333">0.05</text>
  <text x="45" y="240" font-size="10.5" fill="#333">World</text><rect x="115" y="230" width="10" height="13" rx="3" fill="#3b82f6"/><text x="130" y="240" font-size="9.5" fill="#333">0.05</text>

  <!-- Head 2 -->
  <rect x="317" y="58" width="265" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="449" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Head 2: action</text>
  <text x="449" y="97" text-anchor="middle" font-size="9.5" fill="#166534">"What does this program do?"</text>
  <text x="332" y="120" font-size="10.5" fill="#333">Python</text><rect x="402" y="110" width="20" height="13" rx="3" fill="#16a34a"/><text x="427" y="120" font-size="9.5" fill="#333">0.10</text>
  <text x="332" y="144" font-size="10.5" fill="#333">program</text><rect x="402" y="134" width="40" height="13" rx="3" fill="#16a34a"/><text x="447" y="144" font-size="9.5" fill="#333">0.20</text>
  <text x="332" y="168" font-size="10.5" fill="#333">to</text><rect x="402" y="158" width="10" height="13" rx="3" fill="#16a34a"/><text x="417" y="168" font-size="9.5" fill="#333">0.05</text>
  <text x="332" y="192" font-size="10.5" fill="#333">print</text><rect x="402" y="182" width="100" height="13" rx="3" fill="#16a34a"/><text x="507" y="192" font-size="9.5" fill="#333">0.50</text>
  <text x="332" y="216" font-size="10.5" fill="#333">Hello</text><rect x="402" y="206" width="16" height="13" rx="3" fill="#16a34a"/><text x="423" y="216" font-size="9.5" fill="#333">0.08</text>
  <text x="332" y="240" font-size="10.5" fill="#333">World</text><rect x="402" y="230" width="14" height="13" rx="3" fill="#16a34a"/><text x="421" y="240" font-size="9.5" fill="#333">0.07</text>

  <!-- Head 3 -->
  <rect x="604" y="58" width="265" height="200" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="736" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Head 3: content</text>
  <text x="736" y="97" text-anchor="middle" font-size="9.5" fill="#6b21a8">"What will this program print?"</text>
  <text x="619" y="120" font-size="10.5" fill="#333">Python</text><rect x="689" y="110" width="10" height="13" rx="3" fill="#9333ea"/><text x="704" y="120" font-size="9.5" fill="#333">0.05</text>
  <text x="619" y="144" font-size="10.5" fill="#333">program</text><rect x="689" y="134" width="30" height="13" rx="3" fill="#9333ea"/><text x="724" y="144" font-size="9.5" fill="#333">0.15</text>
  <text x="619" y="168" font-size="10.5" fill="#333">to</text><rect x="689" y="158" width="10" height="13" rx="3" fill="#9333ea"/><text x="704" y="168" font-size="9.5" fill="#333">0.05</text>
  <text x="619" y="192" font-size="10.5" fill="#333">print</text><rect x="689" y="182" width="30" height="13" rx="3" fill="#9333ea"/><text x="724" y="192" font-size="9.5" fill="#333">0.15</text>
  <text x="619" y="216" font-size="10.5" fill="#333">Hello</text><rect x="689" y="206" width="60" height="13" rx="3" fill="#9333ea"/><text x="754" y="216" font-size="9.5" fill="#333">0.30</text>
  <text x="619" y="240" font-size="10.5" fill="#333">World</text><rect x="689" y="230" width="60" height="13" rx="3" fill="#9333ea"/><text x="754" y="240" font-size="9.5" fill="#333">0.30</text>

  <text x="450" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">The heads' answers are joined together, giving one richer vector for "program"</text>
  <text x="450" y="308" text-anchor="middle" font-size="10" fill="#555">The original Transformer uses 8 heads. Each head learns its own focus during training; nobody tells it what to look at.</text>
</svg>
