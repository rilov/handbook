<svg viewBox="0 0 900 370" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="370" fill="#f8f9fa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Self-attention is just matrix multiplication</text>

  <defs>
    <marker id="saArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#888"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <text x="40" y="60" font-size="12" font-weight="bold" fill="#333">Step 1: every word gets its Query, Key and Value</text>

  <rect x="120" y="80" width="100" height="75" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">X</text>
  <text x="170" y="175" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">N × D1</text>
  <text x="170" y="190" text-anchor="middle" font-size="9" fill="#555">one row per word</text>

  <text x="245" y="124" text-anchor="middle" font-size="18" fill="#555">×</text>

  <rect x="270" y="68" width="50" height="100" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="295" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b21a8">W_Q</text>
  <text x="295" y="185" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">D1 × D2</text>
  <text x="295" y="200" text-anchor="middle" font-size="9" fill="#555">learned in training</text>

  <text x="345" y="124" text-anchor="middle" font-size="18" fill="#555">=</text>

  <rect x="370" y="80" width="50" height="75" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="395" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Q</text>
  <text x="395" y="175" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">N × D2</text>
  <text x="395" y="190" text-anchor="middle" font-size="9" fill="#555">one query per word</text>

  <rect x="500" y="72" width="370" height="110" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="520" y="100" font-size="12" font-weight="bold" fill="#1e3a8a">Q = X × W_Q</text>
  <text x="640" y="100" font-size="10.5" fill="#444">what each word is looking for</text>
  <text x="520" y="128" font-size="12" font-weight="bold" fill="#1e3a8a">K = X × W_K</text>
  <text x="640" y="128" font-size="10.5" fill="#444">what each word can offer</text>
  <text x="520" y="156" font-size="12" font-weight="bold" fill="#1e3a8a">V = X × W_V</text>
  <text x="640" y="156" font-size="10.5" fill="#444">what each word actually knows</text>

  <line x1="30" y1="215" x2="870" y2="215" stroke="#e2e8f0"/>

  <!-- Step 2 -->
  <text x="40" y="240" font-size="12" font-weight="bold" fill="#333">Step 2: queries meet keys, then blend the values</text>

  <rect x="40" y="258" width="40" height="60" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Q</text>
  <text x="60" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">N×D2</text>

  <text x="97" y="293" text-anchor="middle" font-size="16" fill="#555">×</text>

  <rect x="115" y="268" width="60" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Kᵀ</text>
  <text x="145" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">D2×N</text>

  <text x="192" y="293" text-anchor="middle" font-size="16" fill="#555">=</text>

  <rect x="210" y="258" width="60" height="60" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">QKᵀ</text>
  <text x="240" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">N×N</text>
  <text x="240" y="350" text-anchor="middle" font-size="9" fill="#555">match scores</text>

  <text x="315" y="278" text-anchor="middle" font-size="9.5" fill="#555">÷ √D2, softmax</text>
  <line x1="280" y1="288" x2="350" y2="288" stroke="#888" stroke-width="1.5" marker-end="url(#saArrow)"/>

  <rect x="360" y="258" width="60" height="60" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">A</text>
  <text x="390" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">N×N</text>
  <text x="390" y="350" text-anchor="middle" font-size="9" fill="#555">weights (rows add to 1)</text>

  <text x="440" y="293" text-anchor="middle" font-size="16" fill="#555">×</text>

  <rect x="460" y="258" width="40" height="60" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">V</text>
  <text x="480" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">N×D2</text>

  <text x="520" y="293" text-anchor="middle" font-size="16" fill="#555">=</text>

  <rect x="540" y="258" width="40" height="60" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="560" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b21a8">Z</text>
  <text x="560" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">N×D2</text>
  <text x="560" y="350" text-anchor="middle" font-size="9" fill="#555">rich vectors</text>

  <rect x="615" y="255" width="255" height="70" rx="8" fill="#fff" stroke="#9333ea"/>
  <text x="742" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b21a8">Z = softmax( QKᵀ / √D2 ) × V</text>
  <text x="742" y="308" text-anchor="middle" font-size="10" fill="#555">the whole of self-attention in one line</text>
</svg>
