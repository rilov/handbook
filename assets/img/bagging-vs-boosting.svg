<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="340" fill="#f8f9fa" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Bagging Trains in Parallel, Boosting Trains in Sequence</text>

  <defs>
    <marker id="ebArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Bagging -->
  <text x="20" y="60" font-size="12" font-weight="bold" fill="#1d4ed8">Bagging (e.g. Random Forest)</text>

  <rect x="20" y="70" width="90" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="90" text-anchor="middle" font-size="9" fill="#1d4ed8">Bootstrap</text>
  <text x="65" y="103" text-anchor="middle" font-size="9" fill="#1d4ed8">sample A</text>

  <rect x="20" y="130" width="90" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="150" text-anchor="middle" font-size="9" fill="#1d4ed8">Bootstrap</text>
  <text x="65" y="163" text-anchor="middle" font-size="9" fill="#1d4ed8">sample B</text>

  <rect x="20" y="190" width="90" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="210" text-anchor="middle" font-size="9" fill="#1d4ed8">Bootstrap</text>
  <text x="65" y="223" text-anchor="middle" font-size="9" fill="#1d4ed8">sample C</text>

  <line x1="110" y1="95" x2="140" y2="95" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>
  <line x1="110" y1="155" x2="140" y2="155" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>
  <line x1="110" y1="215" x2="140" y2="215" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>

  <rect x="143" y="70" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="188" y="99" text-anchor="middle" font-size="10" fill="#1d4ed8">Tree A</text>
  <rect x="143" y="130" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="188" y="159" text-anchor="middle" font-size="10" fill="#1d4ed8">Tree B</text>
  <rect x="143" y="190" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="188" y="219" text-anchor="middle" font-size="10" fill="#1d4ed8">Tree C</text>
  <text x="188" y="35" text-anchor="middle" font-size="9" fill="#666" opacity="0"></text>
  <text x="90" y="30" text-anchor="middle" font-size="9" fill="#666" opacity="0"></text>
  <text x="188" y="245" text-anchor="middle" font-size="9" fill="#666">trained independently, at the same time</text>

  <line x1="233" y1="95" x2="263" y2="150" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>
  <line x1="233" y1="155" x2="263" y2="155" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>
  <line x1="233" y1="215" x2="263" y2="160" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>

  <rect x="266" y="120" width="110" height="70" rx="8" fill="#1d4ed8"/>
  <text x="321" y="150" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">Majority</text>
  <text x="321" y="165" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">vote</text>
  <text x="321" y="205" text-anchor="middle" font-size="9" fill="#666">reduces variance</text>

  <line x1="410" y1="155" x2="410" y2="155" stroke="#e5e7eb" stroke-width="0"/>
  <line x1="410" y1="45" x2="410" y2="300" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Boosting -->
  <text x="440" y="60" font-size="12" font-weight="bold" fill="#9d174d">Boosting (e.g. AdaBoost, XGBoost)</text>

  <rect x="440" y="90" width="100" height="60" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="490" y="115" text-anchor="middle" font-size="10" fill="#9d174d">Weak model 1</text>
  <text x="490" y="131" text-anchor="middle" font-size="8.5" fill="#9d174d">on full data</text>

  <line x1="540" y1="120" x2="570" y2="120" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>

  <rect x="573" y="90" width="130" height="60" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="638" y="112" text-anchor="middle" font-size="10" fill="#9d174d">Weak model 2</text>
  <text x="638" y="128" text-anchor="middle" font-size="8.5" fill="#9d174d">focuses on model 1's</text>
  <text x="638" y="140" text-anchor="middle" font-size="8.5" fill="#9d174d">mistakes</text>

  <line x1="703" y1="120" x2="733" y2="120" stroke="#aaa" stroke-width="1.4" marker-end="url(#ebArrow)"/>

  <rect x="736" y="90" width="130" height="60" rx="6" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5"/>
  <text x="801" y="112" text-anchor="middle" font-size="10" fill="#831843">Weak model 3</text>
  <text x="801" y="128" text-anchor="middle" font-size="8.5" fill="#831843">focuses on what's</text>
  <text x="801" y="140" text-anchor="middle" font-size="8.5" fill="#831843">still wrong</text>

  <text x="640" y="170" text-anchor="middle" font-size="9" fill="#666">each model trained only after seeing the previous one's errors</text>

  <line x1="490" y1="150" x2="490" y2="230" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="638" y1="150" x2="638" y2="230" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="801" y1="150" x2="801" y2="230" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="3,2"/>
  <rect x="460" y="230" width="380" height="55" rx="8" fill="#9d174d"/>
  <text x="650" y="252" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">Weighted sum of all models' votes</text>
  <text x="650" y="270" text-anchor="middle" font-size="9" fill="#fbcfe8">reduces bias</text>
</svg>
