<svg viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="310" fill="#f8f9fa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">How the decoder writes, one word at a time</text>

  <defs>
    <marker id="genArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#888"/>
    </marker>
  </defs>

  <text x="275" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">Decoder input (everything written so far)</text>
  <text x="810" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">Predicted next word</text>

  <!-- step rows: y = 60, 102, 144, 186, 228 -->
  <g font-size="11">
    <text x="40" y="81" font-weight="bold" fill="#333">Step 1</text>
    <rect x="100" y="60" width="350" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="115" y="81" fill="#334155" font-family="Menlo, Consolas, monospace">&lt;start&gt;</text>
    <line x1="450" y1="76" x2="495" y2="76" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="500" y="60" width="200" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="600" y="81" text-anchor="middle" fill="#166534">Transformer</text>
    <line x1="700" y1="76" x2="745" y2="76" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="750" y="60" width="120" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="810" y="81" text-anchor="middle" font-weight="bold" fill="#6b21a8" font-family="Menlo, Consolas, monospace">print</text>

    <text x="40" y="123" font-weight="bold" fill="#333">Step 2</text>
    <rect x="100" y="102" width="350" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="115" y="123" fill="#334155" font-family="Menlo, Consolas, monospace">&lt;start&gt; print</text>
    <line x1="450" y1="118" x2="495" y2="118" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="500" y="102" width="200" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="600" y="123" text-anchor="middle" fill="#166534">Transformer</text>
    <line x1="700" y1="118" x2="745" y2="118" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="750" y="102" width="120" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="810" y="123" text-anchor="middle" font-weight="bold" fill="#6b21a8" font-family="Menlo, Consolas, monospace">(</text>

    <text x="40" y="165" font-weight="bold" fill="#333">Step 3</text>
    <rect x="100" y="144" width="350" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="115" y="165" fill="#334155" font-family="Menlo, Consolas, monospace">&lt;start&gt; print (</text>
    <line x1="450" y1="160" x2="495" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="500" y="144" width="200" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="600" y="165" text-anchor="middle" fill="#166534">Transformer</text>
    <line x1="700" y1="160" x2="745" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="750" y="144" width="120" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="810" y="165" text-anchor="middle" font-weight="bold" fill="#6b21a8" font-family="Menlo, Consolas, monospace">"Hello World"</text>

    <text x="40" y="207" font-weight="bold" fill="#333">Step 4</text>
    <rect x="100" y="186" width="350" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="115" y="207" fill="#334155" font-family="Menlo, Consolas, monospace">&lt;start&gt; print ( "Hello World"</text>
    <line x1="450" y1="202" x2="495" y2="202" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="500" y="186" width="200" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="600" y="207" text-anchor="middle" fill="#166534">Transformer</text>
    <line x1="700" y1="202" x2="745" y2="202" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="750" y="186" width="120" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="810" y="207" text-anchor="middle" font-weight="bold" fill="#6b21a8" font-family="Menlo, Consolas, monospace">)</text>

    <text x="40" y="249" font-weight="bold" fill="#333">Step 5</text>
    <rect x="100" y="228" width="350" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="115" y="249" fill="#334155" font-family="Menlo, Consolas, monospace">&lt;start&gt; print ( "Hello World" )</text>
    <line x1="450" y1="244" x2="495" y2="244" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="500" y="228" width="200" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="600" y="249" text-anchor="middle" fill="#166534">Transformer</text>
    <line x1="700" y1="244" x2="745" y2="244" stroke="#888" stroke-width="1.5" marker-end="url(#genArrow)"/>
    <rect x="750" y="228" width="120" height="32" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="810" y="249" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Menlo, Consolas, monospace">&lt;end&gt; stop</text>
  </g>

  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#555">The encoder reads the input once. The decoder runs once per new word, each time with everything written so far.</text>
</svg>
