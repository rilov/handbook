<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="720" height="380" fill="#f8f9fa" rx="12"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The Confusion Matrix, and Where Precision and Recall Come From</text>

  <!-- axis labels -->
  <text x="360" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Predicted</text>
  <text x="290" y="72" text-anchor="middle" font-size="10" fill="#555">Positive</text>
  <text x="430" y="72" text-anchor="middle" font-size="10" fill="#555">Negative</text>
  <text x="60" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151" transform="rotate(-90 60 220)">Actual</text>
  <text x="95" y="145" text-anchor="middle" font-size="10" fill="#555">Positive</text>
  <text x="95" y="290" text-anchor="middle" font-size="10" fill="#555">Negative</text>

  <!-- grid -->
  <rect x="220" y="90" width="140" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">True Positive</text>
  <text x="290" y="150" text-anchor="middle" font-size="10" fill="#15803d">(correctly caught)</text>

  <rect x="360" y="90" width="140" height="100" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">False Negative</text>
  <text x="430" y="150" text-anchor="middle" font-size="10" fill="#b91c1c">(missed it)</text>

  <rect x="220" y="190" width="140" height="100" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">False Positive</text>
  <text x="290" y="250" text-anchor="middle" font-size="10" fill="#b91c1c">(false alarm)</text>

  <rect x="360" y="190" width="140" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">True Negative</text>
  <text x="430" y="250" text-anchor="middle" font-size="10" fill="#15803d">(correctly cleared)</text>

  <!-- Precision / Recall formulas on the right -->
  <rect x="530" y="90" width="175" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="617" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Precision</text>
  <text x="617" y="132" text-anchor="middle" font-size="9.5" fill="#1d4ed8">TP</text>
  <line x1="590" y1="138" x2="644" y2="138" stroke="#1d4ed8" stroke-width="1"/>
  <text x="617" y="152" text-anchor="middle" font-size="9.5" fill="#1d4ed8">TP + FP</text>
  <text x="617" y="170" text-anchor="middle" font-size="9" fill="#1e40af">"of what I flagged, how much was real?"</text>

  <rect x="530" y="200" width="175" height="90" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="617" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d174d">Recall</text>
  <text x="617" y="242" text-anchor="middle" font-size="9.5" fill="#9d174d">TP</text>
  <line x1="590" y1="248" x2="644" y2="248" stroke="#9d174d" stroke-width="1"/>
  <text x="617" y="262" text-anchor="middle" font-size="9.5" fill="#9d174d">TP + FN</text>
  <text x="617" y="280" text-anchor="middle" font-size="9" fill="#831843">"of what was real, how much did I catch?"</text>

  <text x="360" y="320" text-anchor="middle" font-size="10" fill="#666">Precision looks down the predicted-positive column. Recall looks across the actual-positive row.</text>
</svg>
