<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="780" height="320" fill="#f8f9fa" rx="12"/>
  <text x="390" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">YOLO Divides the Image Into a Grid, Each Cell Predicts Boxes</text>

  <!-- image with 7x7 grid -->
  <rect x="30" y="50" width="280" height="240" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="70" y1="50" x2="70" y2="290"/><line x1="110" y1="50" x2="110" y2="290"/>
    <line x1="150" y1="50" x2="150" y2="290"/><line x1="190" y1="50" x2="190" y2="290"/>
    <line x1="230" y1="50" x2="230" y2="290"/><line x1="270" y1="50" x2="270" y2="290"/>
    <line x1="30" y1="84" x2="310" y2="84"/><line x1="30" y1="119" x2="310" y2="119"/>
    <line x1="30" y1="153" x2="310" y2="153"/><line x1="30" y1="187" x2="310" y2="187"/>
    <line x1="30" y1="221" x2="310" y2="221"/><line x1="30" y1="255" x2="310" y2="255"/>
  </g>
  <text x="170" y="305" text-anchor="middle" font-size="9.5" fill="#666">7 x 7 grid (S x S)</text>

  <!-- highlight one cell whose centre the object falls in -->
  <rect x="150" y="153" width="40" height="34" fill="#fde68a" fill-opacity="0.6" stroke="#d97706" stroke-width="1.5"/>

  <!-- predicted box, larger than the cell, centred there -->
  <rect x="105" y="110" width="140" height="120" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="170" cy="170" r="3" fill="#dc2626"/>
  <text x="175" y="105" font-size="9.5" fill="#b91c1c" font-weight="bold">predicted box (x,y,w,h)</text>
  <text x="175" y="120" font-size="8.5" fill="#b91c1c">centre (x,y) falls in the</text>
  <text x="175" y="132" font-size="8.5" fill="#b91c1c">highlighted cell</text>

  <!-- arrow to output tensor -->
  <defs>
    <marker id="yoloArrow" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
  </defs>
  <line x1="315" y1="170" x2="345" y2="170" stroke="#aaa" stroke-width="1.5" marker-end="url(#yoloArrow)"/>

  <!-- output tensor per cell -->
  <rect x="350" y="90" width="400" height="160" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Each cell outputs, per box</text>

  <rect x="365" y="122" width="60" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="395" y="139" text-anchor="middle" font-size="9.5" fill="#1d4ed8">x, y</text>
  <rect x="430" y="122" width="60" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="460" y="139" text-anchor="middle" font-size="9.5" fill="#1d4ed8">w, h</text>
  <rect x="495" y="122" width="90" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="540" y="139" text-anchor="middle" font-size="9" fill="#1d4ed8">confidence</text>
  <rect x="590" y="122" width="145" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="662" y="139" text-anchor="middle" font-size="9" fill="#1d4ed8">C class probabilities</text>

  <text x="550" y="175" text-anchor="middle" font-size="10.5" fill="#1e40af">B boxes per cell, S x S cells</text>
  <text x="550" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">output shape = (S, S, B*5 + C)</text>
  <text x="550" y="225" text-anchor="middle" font-size="10.5" fill="#1e40af">e.g. S=7, B=2, C=20 → (7, 7, 30)</text>
</svg>
