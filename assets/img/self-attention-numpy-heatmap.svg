<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="300" fill="#f8f9fa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">The attention weights A from our NumPy example</text>
  <text x="450" y="47" text-anchor="middle" font-size="10.5" fill="#555">Each row is one word. Darker = more attention. Every row adds up to 1.</text>

  <text x="425" y="68" text-anchor="middle" font-size="10" fill="#555">pays attention to →</text>
  <g font-size="11" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="290" y="84">I</text>
    <text x="380" y="84">drink</text>
    <text x="470" y="84">hot</text>
    <text x="560" y="84">coffee</text>
  </g>
  <g font-size="11" font-weight="bold" fill="#333" text-anchor="end">
    <text x="235" y="115">I</text>
    <text x="235" y="155">drink</text>
    <text x="235" y="195">hot</text>
    <text x="235" y="235">coffee</text>
  </g>

  <g font-size="12" text-anchor="middle">
    <!-- row I: .24 .40 .29 .07 -->
    <rect x="245" y="92" width="90" height="40" fill="#3b82f6" fill-opacity="0.48" stroke="#fff" stroke-width="2"/><text x="290" y="117" fill="#1e3a8a">0.24</text>
    <rect x="335" y="92" width="90" height="40" fill="#3b82f6" fill-opacity="0.80" stroke="#fff" stroke-width="2"/><text x="380" y="117" fill="#fff" font-weight="bold">0.40</text>
    <rect x="425" y="92" width="90" height="40" fill="#3b82f6" fill-opacity="0.58" stroke="#fff" stroke-width="2"/><text x="470" y="117" fill="#1e3a8a">0.29</text>
    <rect x="515" y="92" width="90" height="40" fill="#3b82f6" fill-opacity="0.14" stroke="#fff" stroke-width="2"/><text x="560" y="117" fill="#1e3a8a">0.07</text>
    <!-- row drink: .25 .42 .26 .07 -->
    <rect x="245" y="132" width="90" height="40" fill="#3b82f6" fill-opacity="0.50" stroke="#fff" stroke-width="2"/><text x="290" y="157" fill="#1e3a8a">0.25</text>
    <rect x="335" y="132" width="90" height="40" fill="#3b82f6" fill-opacity="0.84" stroke="#fff" stroke-width="2"/><text x="380" y="157" fill="#fff" font-weight="bold">0.42</text>
    <rect x="425" y="132" width="90" height="40" fill="#3b82f6" fill-opacity="0.52" stroke="#fff" stroke-width="2"/><text x="470" y="157" fill="#1e3a8a">0.26</text>
    <rect x="515" y="132" width="90" height="40" fill="#3b82f6" fill-opacity="0.14" stroke="#fff" stroke-width="2"/><text x="560" y="157" fill="#1e3a8a">0.07</text>
    <!-- row hot: .21 .50 .26 .03 -->
    <rect x="245" y="172" width="90" height="40" fill="#3b82f6" fill-opacity="0.42" stroke="#fff" stroke-width="2"/><text x="290" y="197" fill="#1e3a8a">0.21</text>
    <rect x="335" y="172" width="90" height="40" fill="#3b82f6" fill-opacity="1.00" stroke="#fff" stroke-width="2"/><text x="380" y="197" fill="#fff" font-weight="bold">0.50</text>
    <rect x="425" y="172" width="90" height="40" fill="#3b82f6" fill-opacity="0.52" stroke="#fff" stroke-width="2"/><text x="470" y="197" fill="#1e3a8a">0.26</text>
    <rect x="515" y="172" width="90" height="40" fill="#3b82f6" fill-opacity="0.06" stroke="#fff" stroke-width="2"/><text x="560" y="197" fill="#1e3a8a">0.03</text>
    <!-- row coffee: .21 .35 .40 .04 -->
    <rect x="245" y="212" width="90" height="40" fill="#3b82f6" fill-opacity="0.42" stroke="#fff" stroke-width="2"/><text x="290" y="237" fill="#1e3a8a">0.21</text>
    <rect x="335" y="212" width="90" height="40" fill="#3b82f6" fill-opacity="0.70" stroke="#fff" stroke-width="2"/><text x="380" y="237" fill="#fff" font-weight="bold">0.35</text>
    <rect x="425" y="212" width="90" height="40" fill="#3b82f6" fill-opacity="0.80" stroke="#fff" stroke-width="2"/><text x="470" y="237" fill="#fff" font-weight="bold">0.40</text>
    <rect x="515" y="212" width="90" height="40" fill="#3b82f6" fill-opacity="0.08" stroke="#fff" stroke-width="2"/><text x="560" y="237" fill="#1e3a8a">0.04</text>
  </g>

  <rect x="635" y="92" width="240" height="160" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="652" y="116" font-size="12" font-weight="bold" fill="#333">How to read it</text>
  <text x="652" y="138" font-size="10.5" fill="#444">Row "coffee": 40% of its attention</text>
  <text x="652" y="154" font-size="10.5" fill="#444">goes to "hot", 35% to "drink".</text>
  <text x="652" y="180" font-size="12" font-weight="bold" fill="#333">Careful!</text>
  <text x="652" y="202" font-size="10.5" fill="#444">The weights here are random, so this</text>
  <text x="652" y="218" font-size="10.5" fill="#444">pattern is luck. Training is what makes</text>
  <text x="652" y="234" font-size="10.5" fill="#444">the patterns actually mean something.</text>

  <text x="450" y="282" text-anchor="middle" font-size="10.5" fill="#555">Numbers rounded to 2 decimals, so a row may add to 0.99 or 1.01.</text>
</svg>
